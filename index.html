ollision must be preserved 3 years after the collision date ≥30 s pre-collision capture — 10 Hz (2024) — Singapore 3 years Always on 2 Hz 2 Hz Internal camera - Front camera China 1 years Required Required, but not specify frequency Required, but not specify frequency In the event of an accident, a video of at least 90 seconds prior to the incident must be uploaded within 2 hours. (SH27) UN GTR At least 10 years after last production for design and analysis documents. Until corrective action or completion of review process for safety-related data.… Always on logging, and event based triggering (Annex 6 Para 5.2.1 & 5.3.1) Interval isn't specified but global location must be recorded in decimal degrees to at least five decimal places unrounded (Annex 6 Para 3.3.1(e)) 7 to +7 second from triggering event (Annex 6 Para 5.3.2) Visual images (either camera footage or a virtual construct of other sensor data if camera images are unavailable) for a time frame of -7 to +7 seconds rel… France Not mentioned Not mentioned Required Not mentioned Not mentioned Design to the strictest cell, not the average.  Retention spans 1 year (China) to the life of the ADS plus 10 years after last production (UN GTR). Logging rates run from 2 Hz (Singapore) to 10 Hz (US, 2024 EDR rule). China alone puts a clock on evidence delivery: 90 s of pre-incident video, uploaded within 2 hours. 143", "notes": "", "s": 12, "hidden": false}, {"n": 144, "t": "Where the frameworks disagree", "x": "Where the frameworks disagree Nine requirements where one framework demands what another explicitly declines Requirement US Singapore China UN GTR France Why it matters Safety performance indicators Yes Partial No Yes Yes Only China says no. Everyone else wants measurable safety metrics — CA now names hard braking and VMT. Adapt driving to avoid congestion — Yes No Yes Yes A congestion duty in Singapore, the GTR and France; explicitly not required in the Chinese pilots. Detect & respond to emergency vehicles — Yes No Yes No Emergency-vehicle response is required in Singapore and the GTR, and explicitly not in China or France. Never force others into evasive action — — No Yes No The GTR alone forbids forcing other drivers into evasive action — a hard behavioural constraint to validate. Stop safely on passenger request — Yes No Yes Yes Passenger-initiated safe stop: required in Singapore, the GTR and France, refused in China. Data classification & grading — Yes Yes No No Data classification and grading is a Singapore and China requirement; the GTR and France do not support it. Interior video & audio monitoring — Yes Yes No Yes Interior video and audio: required in Singapore, China and France — the GTR bars continuous cabin recording. Public access to raw incident data Yes — No — No The US is the only one of the five requiring public release; China explicitly does not. Government-to-vehicle hazard alerts Yes — Partial — No Government-to-vehicle hazard alerts exist in the US (CA AB 1777, Seattle); France does not support them. n/m = not mentioned  ·  — = not assessed in the source 144", "notes": "", "s": 12, "hidden": false}, {"n": 145, "t": "Requirement and Feature mapping (1/9)", "x": "145 Requirement and Feature mapping (1/9) Data Retention | R-32 | ADS shall be able to preserve relevant operational data associated with a collision or safety-critical event. | visualize กล้อง sensor และข้อมูลของตัวรถย้อนหลัง สำหรับกรณีเกิด incident ; R-34 | DLT Monitoring System shall be able to preserve synchronized evidence before, during, and after a safety-critical event. | visualize กล้องรอบคัน lidar radar และข้อมูล sensor ของรถทั้งหมดแบบ real time ; visualize กล้อง sensor และข้อมูลของตัวรถย้อนหลัง สำหรับกรณีเกิด incident. Data Recorder Activation | R-29 | ADS shall be able to record activation, deactivation, disengagement, override, and fallback events. | ตาราง incident log และ trigger events ; R-32 | ADS shall be able to preserve relevant operational data associated with a collision o sis 25 · Natural-language query agent A + B Context encoders assume grammatical, unambiguous queries - field users do not write that way 18 · Regulatory report generation C Without validation, generated components encode unsafe behaviour or training-data bias; high-quality generation is slow and expensive 27 / 28 · Vehicle risk & anomaly ranking D LLMs are poor at precise numeric work. Compute the metric; let the model explain the ranking, not produce it", "notes": "", "s": 13, "hidden": false}, {"n": 160, "t": "Agentic framework", "x": "Agentic framework 160", "notes": "", "s": 14, "hidden": false}, {"n": 161, "t": "Netradyne", "x": "Netradyne 161", "notes": "", "s": 14, "hidden": false}, {"n": 162, "t": "Netradyne | AI Agent", "x": "Netradyne | AI Agent Netradyne, an SaaS provider of artificial intelligence (AI) and edge computing Edge Cameras Edge AI Figure : Driver-I advanced AI-powered safety camera system for commercial fleets Netradyne Intelligence Platform (30B+ miles knowledge base) AI Agents Layer Coaching Agent Incident Agent Rewards Agent Reporting Agent Output Reports Insights Actions [13] Netradyne Unveils Netradyne Intelligence: Platform Powers New AI Agents for Safety and Operations,\"", "notes": "", "s": 14, "hidden": false}, {"n": 163, "t": "Netradyne", "x": "Netradyne [12] Netradyne, \"Netradyne Intelligence, Expanded: New Collision Management Agent and MCP Connector,\" Collision Management Agent MCP Connector turns each fleet's incident response process into immediate action and consistent follow-through. Fleets define the triggers, impact severity, evidence requirements, recipients, and escalation paths up front every incident begins with the right process. MCP Connector links Netradyne fleet data directly to AI tools like ChatGPT and Claude, eliminating manual report exports and analysis. Fleet-specific AI insights answer questions on driver coaching, safety risks, and fuel efficiency using real operational data. Workflow automation generates executive reports, prioritizes high-risk drivers, and automates recurring fleet management tasks.", "notes": "", "s": 14, "hidden": false}, {"n": 164, "t": "Netradyne | Dashboard", "x": "Netradyne | Dashboard [11] Netradyne, \"A Smarter Way to Act on Intelligence: The New Netradyne Experience,\" Video Access", "notes": "", "s": 14, "hidden": false}, {"n": 165, "t": "Netradyne | Dashboard", "x": "Netradyne | Dashboard [11] Netradyne, \"A Smarter Way to Act on Intelligence: The New Netradyne Experience,\" Video Access", "notes": "", "s": 14, "hidden": false}, {"n": 166, "t": "Netradyne | Dashboard", "x": "Netradyne | Dashboard Report Central & Premium Reports An automated accident management system: upon detecting a collision the system gathers critical evidence such as video footage, a timeline of events, and driver history This facilitates faster damage reporting and enables better control over insurance claim costs [11] Netradyne, \"A Smarter Way to Act on Intelligence: The New Netradyne Experience,\"", "notes": "", "s": 14, "hidden": false}, {"n": 167, "t": "Netradyne | Dashboard", "x": "Netradyne | Dashboard Report Central & Premium Reports Together, Report Central and Premium Reports make recurring fleet questions easier to answer, whether the goal is managing day-to-day performance, evaluating program progress, or keeping stakeholders informed. [11] Netradyne, \"A Smarter Way to Act on Intelligence: The New Netradyne Experience,\"", "notes": "", "s": 14, "hidden": false}, {"n": 168, "t": "ChatSUMO Agent", "x": "ChatSUMO Agent 168", "notes": "", "s": 14, "hidden": false}, {"n": 169, "t": "Evolution of SUMO Interaction", "x": "Evolution of SUMO Interaction The coordination burden progressively shifts from engineer to agent. 01 NORMAL SUMO Engineer edits files XML • routes • config Run SUMO Inspect logs & edit MANUAL ENGINEERING LOOP 02 CHATSUMO Natural-language request Execute one workflow step User reviews result User directs next step CONVERSATIONAL • USER-COORDINATED 03 CHATSUMO-AGENT One high-level objective Plan • build • run Observe metrics & errors Refine until complete STATEFUL CLOSED LOOP From user-managed steps to agent-managed planning, execution, observation and refinement Source: [1] Sections 1, 2.1, 3.1 and 4.5. ChatSUMO baseline = step-by-step human–LLM interaction.", "notes": "Traditional SUMO work requires XML configuration, scripting and traffic-model expertise. Earlier ChatSUMO introduced end-to-end natural-language control, but the paper’s efficiency baseline still requires users to guide network generation, demand, execution and interpretation step by step. ChatSUMO-Agent internalizes that coordination: it reads state, selects tools, observes simulator outcomes and refines the scenario. The advantage is not a faster SUMO engine; it is removal of repeated human coordination. [SOURCE: [1], Sections 2.1, 3.1 and 4.5.]", "s": 14, "hidden": false}, {"n": 170, "t": "Workflow of ChatSUMO-Agent Overview", "x": "Workflow of ChatSUMO-Agent Overview Source: [1] Sections 1, 2.1, 3.1 and 4.5. ChatSUMO baseline = step-by-step human–LLM interaction. The user workflow chart of ChatSUMO-Agent. User can comunicate with ChatSUMO-Agent real-time to make modification of the generated simulation.", "notes": "Traditional SUMO work requires XML configuration, scripting and traffic-model expertise. Earlier ChatSUMO introduced end-to-end natural-language control, but the paper’s efficiency baseline still requires users to guide network generation, demand, execution and interpretation step by step. ChatSUMO-Agent internalizes that coordination: it reads state, selects tools, observes simulator outcomes and refines the scenario. The advantage is not a faster SUMO engine; it is removal of repeated human coordination. [SOURCE: [1], Sections 2.1, 3.1 and 4.5.]", "s": 14, "hidden": false}, {"n": 171, "t": "ChatSUMO-Agent Closed-Loop Architecture", "x": "ChatSUMO-Agent Closed-Loop Architecture PLAN  →  EXECUTE  →  OBSERVE  →  EVALUATE  →  REFINE 1  PERSISTENT STATE Goals, artifacts/history and observations/context survive across steps. 2  DECIDE + ACT The planner emits one JSON-schema-constrained tool invocation. 3  OBSERVE + RECOVER KPIs and structured errors trigger refinement, clarification or retry. SUMO Builder Traffic Generator SUMO Runner SUMO Modifier Traffic Metrics Source: Reproduced from [1, Fig. 2, p. 5]; provider groups: [1, Table 1, pp. 7–8].", "notes": "Figure 2 shows the system’s state–action–observation loop. The state persists goals, artifacts, execution history and contextual observations; the method text and figure use slightly different labels but the same persistent-state concept. The LLM planner selects one schema-constrained action, while five provider groups ground execution in SUMO. Tool results and structured failures return to state, enabling clarification, replanning and parameter repair. MCP is used by these authors to mean Multi-Tool Control Protocol. [SOURCE: [1], Figure 2 and Sections 3.2–3.5.]", "s": 14, "hidden": false}, {"n": 172, "t": "ChatSUMO-Agent Closed-Loop Architecture", "x": "ChatSUMO-Agent Closed-Loop Architecture Agent-driven traffic simulation from natural-language specifications. ChatSUMO-Agent converts high-level user intents into executable simulation workflows through state-aware planning and provider-based tool execution, producing network artifacts and trajectory-level performance visualizations within a closed-loop framework.", "notes": "Figure 2 shows the system’s state–action–observation loop. The state persists goals, artifacts, execution history and contextual observations; the method text and figure use slightly different labels but the same persistent-state concept. The LLM planner selects one schema-constrained action, while five provider groups ground execution in SUMO. Tool results and structured failures return to state, enabling clarification, replanning and parameter repair. MCP is used by these authors to mean Multi-Tool Control Protocol. [SOURCE: [1], Figure 2 and Sections 3.2–3.5.]", "s": 14, "hidden": false}, {"n": 173, "t": "What ChatSUMO-Agent Adds", "x": "What ChatSUMO-Agent Adds A closed loop changes the operating model, not the physics of SUMO. DIMENSION PRIOR / OPEN-LOOP CHATSUMO-AGENT Workflow One-shot or user-stepped Iterative closed loop State Context held by user Goals, artifacts, outcomes persist Execution Config generation / manual calls Schema-constrained provider tools Failure Inspect logs, edit and rerun Structured error → replan → retry Evidence User-managed files Artifacts, logs, KPIs and fixed seeds >80% lower manual configuration effort 78–95% recovery success EDGE_NF • NO_PATH • GRIDLOCK small, medium and large networks TTR 4.8–21.4 s STATEFUL TOOL-GROUNDED SELF-HEALING AUDITABLE CAVEAT  •  Self-healing restores runnable simulations; it does not guarantee correctness or real-world safety. Source: [1] Abstract; Sections 3.2–3.5, 4.4–4.6; Table 2. Recovery results use controlled failure injection.", "notes": "- The core benefits are state, grounded execution, recoverability and traceable artifacts. The paper reports more than 80% lower manual configuration effort. recovery success ranges from 78% to 95%, with reported time-to-recovery from 4.8 to 21.4 seconds.", "s": 14, "hidden": false}, {"n": 174, "t": "Survey on Multi-Agent autonomous driving system", "x": "Survey on Multi-Agent autonomous driving system 174", "notes": "", "s": 14, "hidden": false}, {"n": 175, "t": "Distributed architecture", "x": "Distributed architecture Centralized, decentralized, hierarchical, or shared-message structures trade off coordination, latency, and robustness. 175 Distributed intelligence beats isolated intelligence Multi-Agent Autonomous Driving Systems with LLMs: A Survey • 2025 Findings of EMNLP 01 Collective perception Cross-agent context expands perceptual range and helps mitigate occlusions / blind spots. 02 Joint decision-making Agents can negotiate intent and trajectories for merges, roundabouts, intersections, and other complex maneuvers. 03 KEYTAKEAWAY • Treat other vehicles / agents as information sources, not only obstacles. • Exchange intent before the critical maneuver, not after conflict appears. • Add safeguards so a bad message does not propagate through the network. • Cooperative / Competitive / Debate interaction mode   • Instructor / partnership paradigm PROJECT ADAPTATION The idea of having a centralized data served as a centralized message pool for AI agents to index and utilize is a practical and feasible way to create knowledge base for AI system. The multi-agent interaction mode is also applicable to our project.", "notes": "", "s": 14, "hidden": false}, {"n": 176, "t": "V-HOI MLCR", "x": "V-HOI MLCR Perception validation framework where use multi-agent to investigate and debate the idea to each agent 176 Mentioned Framework Multi-Agent Autonomous Driving Systems with LLMs: A Survey • 2025 Findings of EMNLP 01 EC-Drive Small LLM used on-board used to make decision, and anomaly analysis are escalated to the cloud platform 02 ChatSim & HumanSim ChatSim uses natural language to generate photorealistic 3D driving environments while humanSim mimick driving behaviour 03 Interaction PATTERN • Centralized - A central agent directs all vehicles • Decentralized – Vehicle communicates peer-to-peer• Hierachical – structured in layered cluster ( can be manage in city level or organization level )• Shared Message pool - Agents asynchronously read and write to a central memory pool PROJECT ADAPTATION The idea of having a centralized data served as a centralized message pool for AI agents to index and utilize is a practical and feasible way to create knowledge base for AI system. The multi-agent interaction mode is also applicable to our project.", "notes": "", "s": 14, "hidden": false}, {"n": 177, "t": "Other related papers", "x": "Other related papers This is where answering one question spawns three more. 177", "notes": "", "s": 14, "hidden": false}, {"n": 178, "t": "Translate traffic structure into an LLM-friendly representation", "x": "178 Translate traffic structure into an LLM-friendly representation TPLLM: Traffic Prediction via Pretrained LLMs • arXiv 2403.02221v2 01 Sequence embedding A 1-D CNN captures temporal patterns from multivariate traffic history. 02 Graph embedding A GCN injects road-network connectivity so spatial relationships are preserved. 03 Efficient adaptation LoRA updates a small fraction of GPT-2 parameters; the pretrained backbone remains frozen. REPRESENTATION PIPELINE Traffic history + Road network → LLM forecast THEME Future prediction, and topology understanding, sensor forecasting PROJECT ADAPTATION Topology graph understanding methodology (Graph Embedding) raised in this paper is an interesting approach where we could parse model a topology data and make it utilize the knowledge of the connectivity of each object within the system.", "notes": "", "s": 14, "hidden": false}, {"n": 179, "t": "Turn heterogeneous crash evidence into language", "x": "179 Turn heterogeneous crash evidence into language Learning Traffic Crashes as Language • arXiv 2406.10789v1 01 Textualize multimodal data Police reports, infrastructure, driver, event, and satellite information are converted into ~300-word structured descriptions. 02 Predict rare outcomes better CrashLLM improves average F1 from 34.9% to 53.8% across injuries, severity, and accident types. 03 Reason about what-if changes Attribute perturbation enables counterfactual analysis without retraining the model. WHY IT MATTERS • Text structure can unify data types that are difficult to combine in conventional classifiers. • LLM reasoning helps avoid collapsing toward majority classes such as zero injuries. • Counterfactual inputs turn the model into a scenario-analysis tool, not only a predictor. PROJECT ADAPTATION This dataset is curated with human-machine collaboration approach which could be a way for us to also put human in loop for an investigation report generation hoping that one day we can generate reliable report based on methodologies and pattern we collected alongside our operation. Artificial Intelligence for Transportation​", "notes": "", "s": 14, "hidden": false}, {"n": 180, "t": "Regulations and feature reference", "x": "Regulations and feature reference", "notes": "", "s": 15, "hidden": false}, {"n": 181, "t": "Agentic AI use case adoption", "x": "Agentic AI use case adoption", "notes": "", "s": 15, "hidden": false}, {"n": 182, "t": "Clear Responsibilities", "x": "Clear Responsibilities Ollama runs inference. The Agent Service orchestrates. MLflow records and evaluates. OLLAMA Loads the model and generates responses Executes inference requests and returns model output. LIVE MODEL ACCESS AGENT SERVICE Coordinates evidence and report generation Builds prompts, calls tools and assembles reports through LangGraph. IMPLEMENTING Records experiments, traces and evaluations Supports run comparison, custom scoring and version history. AI GATEWAY Live: qwen3.8-8b Prototype: qwen2.5:7b-instruct Routes requests to Ollama and logs calls as traces. Inference stays in Ollama. MLflow supplies the record used to inspect and evaluate results.", "notes": "The project’s ADR 0002, dated 2026-09-12 and marked Proposed, separates responsibilities: Ollama serves the model, the Agent Service orchestrates the workflow, and MLflow tracks, registers and evaluates. These are project-specific boundaries. The deck does not make a blanket claim that the MLflow platform can never support model serving. The supplied source describes a separate live stack: Cloudflare → Caddy → MLflow AI Gateway → Ollama. It exposes /v1/chat/completions and logs calls as traces. The live model is named qwen3-8b in that document. The deleted agent prototype used qwen2.5:7b-instruct. Convergence between those configurations remains unconfirmed. Registry use was demonstrated once and was not wired into the default path. Multi-model ocal-model calls. The document reports 13,870 total tokens and approximately 18 seconds median latency. These scopes differ, so the two results must not be presented as a controlled model-quality comparison. The source reports that commit acf7aa1 on 2026-09-14 deleted the agent code and that no subsequent commit restored it at the time of that snapshot. It separately reports a live MLflow AI Gateway integration. Project evidence cited by the supplied document: docs/implementation-status.md; contracts/reports/investigation-report.v1.schema.json; commits c1e5e1a and acf7aa1. Source: MLflow-presentation.md. Implementation status is as reported in the supplied project snapshot, including changes dated 13–14 September 2026. Theme reference: Capstone Weekly Update #5(1).pptx.", "s": 15, "hidden": false}, {"n": 187, "t": "MLflow / Ollama / Backend Architecture", "x": "MLflow / Ollama / Backend Architecture Public and Registry clients share the live MLflow AI Gateway Live model access External caller Bearer API key Public access cloudflared + Caddy Ollama qwen3-8b / qwen3.8-27b Internal GPU inference Public: /v1/chat/completions only Model Registry GatewayChat wrapper Internal Gateway client MLflow Tracking Postgres metadata RustFS artifacts Call traces Registry access bypasses the public proxy Backend integration to implement Go API Skeleton only Agent Service Absent, needs restoration MLflow AI Gateway Same live endpoint No live Go-to-agent integration yet Solid blue: live     Dashed: proposed connection or missing implementation MLflow AI Gateway Model routing and tracing", "notes": "This high-level diagram reflects the supplied arch.md snapshot dated 2026-09-16, commit 43a2eb2. It separates live infrastructure from proposed application integration. The lower Gateway node is a reference to the same live Gateway shown above, not a second deployment. Request arrows are shown for clarity; completions return along the reverse public path. The Tracking node identifies the data recording function of the live MLflow deployment, not an additional inference hop. Live public path: an external caller posts to https://<tunnel>/v1/chat/completions with a Bearer API key. cloudflared forwards to Caddy :8080. Caddy maps the key using keys.caddy, substitutes MLflow Basic-auth credentials and rewrites the path to /gateway/mlflow/v1/chat/completions on mlflow:5000. The source describes Host: localhost:5000 for MLflow's DNS-rebinding guard. Unknown keys return 401. Only the chat-completions path is public through Caddy; other routes return 404. Incoming X-MLflow-Authorization is stripped on this public path. MLflow AI Gateway resolves the selected endpoint using models.yaml. The two configured endpoints are qwen3-8b and qwen3-0.6b, both using the Ollama provider. For the example qwen3-8b request, the provider api_base is http://ollama:11434/v1 and the served model is robotaxi-qwen3-8b. Ollama has no published host port and runs on robotaxi-mlflow-net with a GPU reservation. setup.py synchronizes endpoint/model definitions and matching Registry entries from models.yaml. The caller-facing endpoint names are intentionally shown on the slide instead of provider-internal model names. Registry path: the live GatewayChat Model Registry entry is a ResponsesAgent wrapper from platform/mlflow/chat_model.py. When invoked in process, GatewayChat.predict() creates an OpenAI client pointed at {MLFLOW_TRACKING_URI}/gateway/mlflow/v1 and authenticates with X-MLflow-Authorization: Basic <encoded credentials>. This path bypasses Caddy and calls the same Gateway endpoint. The artifact's existence does not establish a separate public model-serving endpoint or a completed release-approval workflow. Tracking is live with a Postgres backend store, RustFS S3-compatible artifact storage and basic authentication, per deploy/compose/mlflow.compose.yaml. The public Gateway logs model-call traces. Full agent/tool spans and evaluation reports still require restoration of the absent Agent Service and evaluation code. Proposed application path: Go API will own application records and authorization and send an Investigation Request to the LangGraph Agent Service. The agent's model adapter should call the existing Gateway endpoint, preserving provider routing behind the caller contract. Go API currently contains hexagonal skeleton folders with .gitkeep files only. Agent code was built and traced on 2026-09-13 (c1e5e1a), deleted on 2026-09-14 (acf7aa1), and remains absent in this snapshot. There is no live Go-to-agent-to-model path. contracts/http/api.yaml is draft-only. The historical 30/30 baseline and 7/10 agent subset used different scopes and do not establish a controlled model comparison. Open gaps from arch.md: no restored agent calls the Gateway; no Go API implementation; draft HTTP contract; untracked .github/workflows/deploy.yml with unclear intent; Obsidian MCP ConnectionRefused, leaving vault content unverified rather than absent. Project evidence cited by arch.md: deploy/compose/mlflow.compose.yaml; deploy/compose/gateway.compose.yaml; platform/mlflow/models.yaml; platform/mlflow/setup.py; platform/mlflow/chat_model.py; platform/mlflow/caddy/Caddyfile; services/agent-python/src; services/api-go/internal; ADR 0002; docs/BACKEND_IMPLEMENTATION_PLAN.md. Sources: supplied MLflow-presentation.md and arch.md. The architecture document reports repo inspection on 2026-09-16 at commit 43a2eb2, branch feat/GH-001-agent-python-baseline. These are supplied project findings, not an independent repo inspection for this presentation. The Obsidian MCP connection failed in that inspection, so its contents remain unchecked. Theme reference: Capstone Weekly Update #5(1).pptx.", "s": 15, "hidden": false}, {"n": 188, "t": "(Inspired by nuScenes)", "x": "(Inspired by nuScenes) 188 Agentic AI for Incident Analysis Agent", "notes": "", "s": 15, "hidden": false}, {"n": 189, "t": "Overview", "x": "Overview Source: [2] DiogoRibeiro | AI-Incident-Analysis-Agent AKEAWAYS Mode / Use case Incident Analysis Agent (Inspired by nuScenes) Agentic AI for Root Cause Analysis (Zhang et al., 2025) Agentic AI for natural language query (vibe agentic inspired by chatSUMO) Qwen3:8bOn rtx 3060 Good response ~20s Cannot do the job. Model is not multimodal Partially do the job but not that good. Model does not support picture. 10-15s Qwen3.5:35b * 2 On rtx 5090 *2 - Answer fast, and spread load. It can do the task easily if we fine tune the prompt, but if not, it will return lots of thinking process. -", "notes": "This table retains all eight use cases in the supplied slide outline. Compare LLMs/configurations: proposed because only one model was tested in the agent prototype. Two model names across separate integrations do not establish a controlled comparison. Record versions: the source maps parameters and mlflow.genai registry use to the deleted prototype. The slide uses plain capability names, rather than implying a verified SDK call or complete dataset-registry implementation. Trace calls: @mlflow.trace spans, latency and token recording were previously verified and then removed with the agent code. Live Gateway traces are a narrower existing capability. Evaluate reports: custom scorers log metrics and artifacts. The evaluation code needs restoration. Baseline versus agent: historical results are 30/30 baseline and 7/10 agent subset, on different scopes. Approve/register versions: Model/Prompt Registry was demoed once but not wired into the default path. Registry versioning alone does not constitute a completed approval workflow. Monitor regression: proposed comparisons across repeated evaluation runs. Airflow: proposed DAG triggers an evaluation runner, and the runner logs to MLflow. The current DAGs are empty in the supplied snapshot. Project evidence cited by the supplied document: docs/implementation-status.md; evaluation/README.md (the document warns that its implementation claim is stale); ADR 0002. Source: MLflow-presentation.md. Implementation status is as reported in the supplied project snapshot, including changes dated 13–14 September 2026. Theme reference: Capstone Weekly Update #5(1).pptx.", "s": 15, "hidden": false}, {"n": 202, "t": "Architectural Design Diagram, model evaluation", "x": "Architectural Design Diagram, model evaluation", "notes": "", "s": 16, "hidden": false}, {"n": 203, "t": "Referenced by BFCL's framework", "x": "Referenced by BFCL's framework 203 Model Evaluation", "notes": "", "s": 16, "hidden": false}, {"n": 204, "t": "WHAT is the BFCL: measures whether an LLM can use tools correctly", "x": "WHAT is the BFCL: measures whether an LLM can use tools correctly Source: [1] Patil et al., ICML 2025. 5,551 question–function–answer pairs Python  •  Java  •  JavaScript REST  •  SQL Core question Did the model choose the right function and supply acceptable arguments? 1  SINGLE-TURN Simple, multiple, parallel and relevance / abstention cases. 2  LIVE / CROWD Fresh, real user queries act as a contamination stress test. 3  MULTI-TURN Stateful API suites test memory, missing information and long context. 4  AGENTIC Web search, memory and SQL extend evaluation beyond a single call. The success criterion shifts from plausible text to a verifiable action. 204", "notes": "BFCL is a benchmark for function calling and tool use. It spans five interfaces and four evaluation regimes, progressing from single-turn calls to multi-turn and agentic tasks. The core question is operational: did the model invoke the right function with acceptable arguments? Sources: [1]", "s": 16, "hidden": false}, {"n": 205, "t": "WHY we adopt this BFCL’s framework: Single-call accuracy is not agent reliability", "x": "WHY we adopt this BFCL’s framework: Single-call accuracy is not agent reliability Source: [1] Patil et al., ICML 2025. Earlier benchmarks BFCL adds Mostly isolated calls or limited executable APIs REAL-WORLD PATTERNS Parallel calls, abstention, long context and chained state Execution-only checking is expensive and hard to scale SCALABLE CHECKING AST, state and response checks preserve flexibility Static public sets can leak into training data FRESHNESS Crowd-sourced queries test contamination sensitivity An agent must track state, recover across steps, and know when not to call a tool. 205", "notes": "BFCL addresses gaps in earlier tool-use benchmarks. It covers realistic patterns, avoids requiring every function to be executable, and uses a fresh crowd-sourced set as a contamination stress test. This matters because reliable agents must manage state and uncertainty across more than one call. Sources: [1]", "s": 16, "hidden": false}, {"n": 206, "t": "WHY we adopt this BFCL’s framework: Single-call accuracy is not agent reliability", "x": "WHY we adopt this BFCL’s framework: Single-call accuracy is not agent reliability Source: [1] Patil et al., ICML 2025. 206", "notes": "BFCL addresses gaps in earlier tool-use benchmarks. It covers realistic patterns, avoids requiring every function to be executable, and uses a fresh crowd-sourced set as a contamination stress test. This matters because reliable agents must manage state and uncertainty across more than one call. Sources: [1]", "s": 16, "hidden": false}, {"n": 207, "t": "BFCL V3: Multi-Turn & Multi-Step Data Composition", "x": "BFCL V3: Multi-Turn & Multi-Step Data Composition Source: [1] Patil et al., ICML 2025. 207", "notes": "BFCL addresses gaps in earlier tool-use benchmarks. It covers realistic patterns, avoids requiring every function to be executable, and uses a fresh crowd-sourced set as a contamination stress test. This matters because reliable agents must manage state and uncertainty across more than one call. Sources: [1]", "s": 16, "hidden": false}, {"n": 208, "t": "HOW we evaluate: Multi-turn BFCL checks both state and evidence", "x": "HOW we evaluate: Multi-turn BFCL checks both state and evidence Sources: [1] Patil et al., 2025; [2] Mao et al., BFCL V3 blog, 2024. 200 ENTRIES BASE All information present 200 ENTRIES MISSING PARAMETER Ask; do not call yet 200 ENTRIES MISSING FUNCTION Abstain until tool exists 200 ENTRIES LONG CONTEXT Ignore irrelevant detail USER TURN One user message MODEL STEP(S) Assistant → tool → result Repeat inside the turn TRANSPARENT BACKEND State + tool results CHECK AFTER EACH TURN 1 STATE-BASED CHECK Backend state equals the ground-truth state. Any valid call sequence may pass. 2 RESPONSE / PATH CHECK Tool results contain the minimal necessary results. Order may differ; extras are allowed. PASS = BOTH CHECKS, ON EVERY TURN 208", "notes": "A turn is one user message; a step is one assistant–tool interaction inside a turn. BFCL V3 evaluates four 200-entry splits used by this project. After each turn, the evaluator checks backend state and the required tool results. The case passes only when both checks pass for every turn. Sources: [1], [2]", "s": 16, "hidden": false}, {"n": 209, "t": "Lenient decoding adds 16.6 points by removing most malformed calls", "x": "Lenient decoding adds 16.6 points by removing most malformed calls qwen-3.8, Prompt mode, 3 runs per mode, base n=30, missing_parameter n=20, 2 of 4 splits complete, not leaderboard-comparable multi_turn_base, 30 cases, 3 runs per mode STRICT (on avg) 46.7% stdev 10.0 LENIENT (on avg) 63.3% stdev 3.3 Gain: 16.6 percentage points Malformed: 9.3 versus 1.3 cases per run Always pass 5; always fail 4 Flaky across runs: 21 cases Strict alone swings 20 points across runs 209", "notes": "multi_turn_base uses 30 cases with all required information present. Lenient accuracy exceeded strict accuracy in all three paired runs, with gains of 23, 7, and 20 points. Strict accuracy moved 20 points between runs, which is why the deck reports three-run means. Source: result.md, “Split 1: multi_turn_base.”", "s": 16, "hidden": false}, {"n": 210, "t": "Lenient adds 11.6 points, yet tools fire in 17 of 20 no-call turns", "x": "Lenient adds 11.6 points, yet tools fire in 17 of 20 no-call turns qwen-3.8, Prompt mode, 3 runs per mode, base n=30, missing_parameter n=20, 2 of 4 splits complete, not leaderboard-comparable multi_turn_missing_parameter, 20 cases, 3 runs per mode STRICT  31.7% stdev 5.8 LENIENT  43.3% stdev 5.8 20 turns where the expected action is no tool call Called anyway  17 No call 3 85% called or acted instead of asking Always fail 8 cases; always pass 3 BFCL does not score no-call turns directly 210", "notes": "multi_turn_missing_parameter tests whether the model asks for a missing value instead of guessing. Lenient decoding removes malformed outputs but exposes more state failures, and the model still calls tools in 17 of 20 turns where no call is expected. The evaluator permits extra exploratory calls, so a pass does not require identical calls. Source: result.md, “Split 2: multi_turn_missing_parameter.”", "s": 16, "hidden": false}, {"n": 211, "t": "Fixing output format adds 11.6–16.6 points, but most cases still fail", "x": "Fixing output format adds 11.6–16.6 points, but most cases still fail qwen-3.8, Prompt mode, 3 runs per mode, base n=30, missing_parameter n=20, 2 of 4 splits complete, not leaderboard-comparable Mean accuracy with stdev error bars Strict Lenient 0% 20% 40% 60% 80% 46.7% 63.3% base (n=30) 31.7% 43.3% missing_parameter (n=20) Malformed calls per run Strict Lenient 0 5 10 base 9.3 1.3 missing_parameter 8.7 0 Remaining failures Wrong state Skipped steps Guessed missing parameters 211", "notes": "The cross-split pattern is consistent: the lenient decoder removes most formatting losses, raising accuracy by 11.6 to 16.6 points. It does not solve state tracking, missing steps, or guessing. Because the endpoint ignores temperature and seed, the deck uses three-run means rather than a single run. Source: result.md, summary table and cross-split findings.", "s": 16, "hidden": false}, {"n": 212, "t": "Load Test : Eval Scope", "x": "212 Load Test : Eval Scope", "notes": "", "s": 16, "hidden": false}, {"n": 213, "t": "Native Tool calling with BFCL multi-turn dataset with full cases test", "x": "Native Tool calling with BFCL multi-turn dataset with full cases test 213 Model Evaluation", "notes": "", "s": 16, "hidden": false}, {"n": 214, "t": "qwen-3.8 native tool calling", "x": "qwen-3.8 native tool calling on the full BFCL multi-turn split 2026-10-15/16 BFCL V3 multi_turn_base and multi_turn_missing_parameter 200 cases each, 1 run Own harness and scorer", "notes": "This update extends our native tool-calling test to all 200 cases in each of two BFCL V3 multi-turn splits. The model is qwen-3.8, with streaming enabled. The scores come from our own harness and scorer, so leaderboard comparisons need a clear qualification. Source: supplied native-full200.md text, Setup.", "s": 16, "hidden": false}, {"n": 215, "t": "The endpoint now supports native tools and streaming", "x": "The endpoint now supports native tools and streaming 20 cases per split, 2 runs per mode BFCL-EVAL DATA V3 multi-turn 20 cases per split AGENT CLIENT native tools or prompt full history resent ENDPOINT tools passthrough streaming, stateless EVALUATORS state + path MLFLOW metrics + traces Three modes prompt-strict Tool documentation in prompt Strict parser prompt-lenient Same prompt Tolerant decoder native OpenAI tools field Model returns tool_calls Every run streamed + full 200 cases", "notes": "The endpoint now passes the OpenAI tools field through and supports streaming. The server remains stateless, so the client resends assistant tool calls and tool results with every request. All comparisons use streaming, 20 cases per split, and two runs per mode. Source: native-tool-calling.md, Setup.", "s": 16, "hidden": false}, {"n": 216, "t": "qwen-3.8 sits near open Qwen results, but comparison is indicative", "x": "qwen-3.8 sits near open Qwen results, but comparison is indicative 20 cases per split, 2 runs per mode Model Base accuracy 0 30 60 90 xLAM-2-70b-fc-r (FC), rank 1 82.5 Claude-Opus-4-5 (FC) 81.0 Gemini-3-Pro-Preview (FC) 69.0 qwen-3.8 native (ours, 20 cases) 60.0 Qwen3-32B (FC) 56.0 qwen-3.8 prompt-strict (ours) 55.0 Qwen3-32B (Prompt) 54.0 muse-glimmer native (ours) 50.0", "notes": "The leaderboard offers context rather than a direct ranking. Our qwen-3.8 native result falls near the stronger open Qwen rows and below frontier function-calling models. Differences in case count, harness, endpoint, and model version prevent direct comparison. Source: native-tool-calling.md, Compared with the BFCL leaderboard.", "s": 16, "hidden": false}, {"n": 217, "t": "qwen-3.8 passes 137 of 200 Base cases", "x": "qwen-3.8 passes 137 of 200 Base cases 200 cases per split, 1 run, own scorer 68.5% 137 / 200 cases 95% CI ≈ 62–75% Metric Full Base run (200 cases) 20 cases run State pass 77.5% 65% Path pass 77.0% 65% Failures STATE 39, PATH 15, AVOIDED 9 STATE 7, PATH 1, AVOIDED 0 Steps per turn 3.01 4.3 Seconds per case 15.8 (53.2 min total) 24.3 Accuracy 68.5% 60% 0 malformed calls 0 step-limit failures 0 reported errors", "notes": "On multi_turn_base, qwen-3.8 passed 137 of 200 cases under our scorer in one run. The approximate confidence interval is 62–75%, so small leaderboard differences should not be overinterpreted. State and path pass are each above combined accuracy, with decision failures discussed later. Source: supplied native-full200.md text, Part 1 Base result.", "s": 16, "hidden": false}, {"n": 218, "t": "Keep native as default; re-score Missing Parameter next", "x": "Keep native as default; re-score Missing Parameter next 200 cases per split, 1 run, own scorer Current default qwen-3.8 native tool calling + streaming Evidence boundary Base: 68.5% under our scorer. Missing Parameter: 62.0% provisional. Re-score both runs with the official BFCL checker. Read AVOIDED traces and check empty-ground-truth turns.", "notes": "The full Base run supports keeping qwen-3.8 with native tool calling and streaming as the current default. The Missing Parameter figure should remain provisional until the official checker handles missing-value turns. Next we will review avoided-tool-use traces, strengthen our scorer, and run the other two multi-turn splits at full size; these results still represent one run per split. Source: supplied native-full200.md text, Conclusion and next steps.", "s": 16, "hidden": false}, {"n": 219, "t": "Agentic AI for natural language query", "x": "219 Agentic AI for natural language query", "notes": "", "s": 16, "hidden": false}, {"n": 220, "t": "Incident Report Agent", "x": "Incident Report Agent 220 Agentic AI Evaluation", "notes": "", "s": 17, "hidden": false}, {"n": 221, "t": "Evaluation", "x": "Evaluation 221 Layer 1 : Factual Correctness Evaluate the factual accuracy of llm_analysis. Extract atomic facts from LLM-generated text. Verify claims against nuScenes telemetry and ground-truth data. Metrics: Factual Precision, Numeric Error, Unsupported Claim Rate. Layer 2 : Incident Interpretation Evaluate the LLM's understanding of driving events. Construct human-verified Gold Events from nuScenes. Extract structured events from llm_analysis and compare them with Gold Events. Metrics: Event Precision, Recall, F1, Temporal Accuracy.", "notes": "รายงานออกเป็น JSON, Markdown, HTML โดย evaluator อ่าน JSON และตรวจ llm_analysis ซึ่งเป็นคำตอบของโมเดล ไม่ตรวจ template telemetry ที่ reporter เติมเอง Sources: src/incident_agent/robotaxi/reporter.py; evaluation.py; evaluate_robotaxi_reports.py.", "s": 17, "hidden": false}, {"n": 222, "t": "Evaluation – Layer 1 Factual Correctness", "x": "Evaluation – Layer 1 Factual Correctness 222 Paper : FActScore [3] Atomic Facts Generated Text FActScore Evidence Check Objective: Evaluate the factual precision of LLM-generated text. Atomic Fact Extraction: Break down generated text into individual, verifiable atomic facts using an LLM. Knowledge Retrieval: Retrieve supporting evidence from reliable sources, such as Wikipedia. Fact Verification: Use an LLM to determine whether each atomic fact is supported by  and Data Contract Context Development needs repeatable vehicle and scene inputs before real vehicle integration. Services need consistent metadata and links to scene evidence. Decision Use nuScenes as the initial replay source and its structures as the metadata contract. Replay records with their original timing and keep sensor files separate from metadata. Map future vehicle feeds to the same contract. Positive Repeatable inputs for development and demonstrations. Traceable scene evidence and a common integration target. Negative Services depend on nuScenes structures and conventions. Future feeds need field mappings and policies for missing data. Accepted", "notes": "Source: ADR.docx provided by the user. ADR-001: Dataset-backed Replay and Data Contract Title Dataset-backed Replay and Data Contract Context RoboTaxi requires a repeatable source of vehicle and scene data to develop and demonstrate its safety-monitoring pipeline before integrating real vehicle feeds. The project has selected nuScenes as its initial dataset and proposed a mock data streamer. Processing services, dashboard views, and AI services need consistent data structures and references so that results can be traced back to the corresponding scene evidence. The team must define the streamer's output format, playback timing, and handling of camera images and point clouds. Decision Use nuScenes as the initial replay source and retain its data structures and conventions as the reference contract for streamed metadata. Future vehicle-data integrations will adapt their available data to this contract. Status Accepted Consequences Positive Provides repeatable scene inputs for pipeline development, demonstrations, and investigation of unexpected results. Reduces initial schema-design work by building on the dataset structure already explored by the team. Preserves the relationship between streamed records and their original scene evidence. Original-timing replay supports demonstrations of how the system processes recorded events as they arrive over time. Keeps sensor-file contents outside metadata messages, allowing services to retrieve the files they need separately. Establishes a common integration target for future vehicle-data adapters. Negative Downstream services become coupled to nuScenes structures and conventions. Changing the contract later may require changes across multiple services. Real vehicle feeds may not provide equivalent fields or annotations. Future adapters will require explicit mappings and policies for unavailable data.", "s": 20, "hidden": false}, {"n": 246, "t": "Architecture Decision Record (ADR) 2", "x": "246 Architecture Decision Record (ADR) 2 Safety Metric Computation and Evidence Traceability Context Streaming and batch processing need consistent safety calculations. Every result must link to its evidence and calculation configuration. Decision Calculate metrics from available nuScenes annotations, telemetry and map data. Share one calculation module and versioned configuration across Spark and Airflow batch jobs. Store source references, timestamps, implementation versions and applicable threshold versions with each result. Positive Consistent formulas across streaming and batch jobs. Reproducible results without waiting for ML inference. Negative Metric availability depends on the required inputs. Maintain runtime compatibility and retain historical evidence and configurations. Accepted", "notes": "Source: ADR.docx provided by the user. ADR-002: Safety Metric Computation and Evidence Traceability Title Safety Metric Computation and Evidence Traceability Context RoboTaxi uses safety metrics to support monitoring and incident investigation. The initial metric scope includes TTC/TTC2D, PET, and TTLC/TLC, subject to the availability of the required inputs. The system includes streaming processing and historical batch processing, so both paths need consistent calculation logic. Results must remain traceable to the source evidence and calculation configuration used to produce them. Decision Calculate the initial safety metrics from nuScenes annotations, telemetry, and map data where the required inputs are available. Implement metric formulas in a shared calculation module used by Spark and by batch jobs orchestrated through Airflow. Both paths will use the same implementation and versioned calculation configuration. Store each metric result with references to its source records, the relevant timestamps, the formula or implementation version, and the threshold configuration version where applicable. Retain access to the referenced source data and configurations so that results can be investigated and recalculated. Status Accepted Consequences Positive Uses dataset-provided evidence for initial calculations, avoiding a dependency on the availability of the team's ML inference pipeline. Reduces duplicated calculation logic and the risk of formula differences between streaming and batch processing. Allows calculation changes to be maintained and tested through a shared module. Connects metric results to the evidence and configuration needed for investigation and reproduction. Negative Metric availability depends on whether nuScenes provides the necessary inputs. Feasibility must be checked separately for each metric. The shared module must remain compatible with both streaming and batch execution environments. Recalculation depends on retaining accessible source records and historical calculation configurations. Changes to formulas or thresholds require version management and may require historical results to be recalculated.", "s": 20, "hidden": false}, {"n": 247, "t": "Architecture Decision Record (ADR) 3", "x": "247 Architecture Decision Record (ADR) 3 Selection of Safety Metrics Context Safety monitoring needs interpretable indicators supported by automotive references and traffic-safety research. Decision Adopt three complementary time-based indicators. TTC estimates time to collision under a specified motion model. PET measures observed separation at a shared conflict area. TLC / TTLC estimates time to crossing a lane boundary. Positive Established references from ISO, FHWA and safety research. Numerical outputs support event ranking and comparisons. Negative Requires validated calculations and suitable inputs. Keyframes at 2 Hz limit temporal detail. Interpretation depends on the scenario. Referenced standards do not establish compliance. Accepted", "notes": "Source: ADR.docx provided by the user. ADR-003: Selection of Safety Metrics Title Selection of Safety Metrics Context RoboTaxi requires interpretable numerical indicators to support safety monitoring, event prioritization, and retrospective investigation. The selected metrics should have established technical definitions and supporting evidence from automotive standards or traffic-safety research. They should cover complementary aspects of vehicle interaction and lane departure while supporting reproducible quantitative comparisons. Decision Adopt Time to Collision (TTC), Post-Encroachment Time (PET), and Time to Line/Lane Crossing (TLC, also termed TTLC) as foundational safety indicators. Use TTC to assess predicted temporal proximity to collision under a specified motion model, PET to measure the observed temporal separation between road users passing through a defined conflict area and TLC to assess estimated time to crossing a lane boundary. Status Accepted Consequences Positive Established automotive references. TTC is defined in ISO 15623:2013, Section 3.20, for forward vehicle collision warning systems. TTLC is defined in ISO 17361:2017, Section 3.9, for lane departure warning systems. These references provide established terminology and technical foundations for the selection. [1], [2]. Recognized traffic-safety applications. FHWA’s Surrogate Safety Assessment Model uses TTC and PET to characterize traffic conflicts and support comparative safety analysis. Westhofen et al. also review TTC and PET, including their applicability and limitations in automated-driving assessment. [3], [4]. Interpretable quantitative outputs. Time-based values support numerical summaries, distributions, event ranking, and comparisons under documented assumptions. FHWA’s SSAM demonstrates the use of surrogate measures in statistical comparisons between alternatives. [3]. Complementary coverage. TTC addresses predicted collision proximity, PET addresses observed separation at shared conflict areas, and TLC addresses lane-boundary approach. Together, they provide several perspectives on a scene rather than relying on a single indicator. [1], [2], [4]. Negative Additional implementation and validation. nuScenes does not directly supply these metric values. The team must implement trajectory reconstruction, relative-motion calculations, conflict-area detection, and lane-boundary calculations as required by each metric. [5]. Sensitivity to input quality. Annotation sampling, velocity estimation, interpolation, coordinate transformations, and map alignment can affect the derived results. The standard annotated keyframes are provided at 2 Hz, which must be considered when estimating short-duration events. [5]. Scenario-dependent applicability. TTC depends on the chosen motion model; PET requires observed passages through a defined conflict area; and TLC requires suitable lane-boundary geometry. A metric may be unavailable or unsuitable for a particular scene. [1], [2], [4]. Interpretation requires care. Equal numerical values across different metrics do not represent equivalent risk. Numerical differences alone do not establish statistical significance, and adopting metrics referenced by standards does not establish system compliance with those standards.", "s": 20, "hidden": false}, {"n": 248, "t": "Architecture Decision Record (ADR) 4", "x": "248 Architecture Decision Record (ADR) 4 Identity and Access Management Context The Next.js frontend and Go backend need consistent authentication, centralized accounts and controlled access to protected functions. Decision Use Keycloak as the centralized identity provider with OpenID Connect. Manage users and role assignments in Keycloak and include role claims in access tokens. Validate tokens and enforce role-based authorization in the Go backend. Define the permission matrix separately. Positive Centralized identity management with less custom code. Reuses team experience and supports consistent API access checks. Negative Keycloak needs maintenance, monitoring and backup. Keep client settings, token claims and API permissions aligned. Accepted", "notes": "Source: ADR.docx provided by the user. ADR-004: Identity and Access Management Title Identity and Access Management Context RoboTaxi requires consistent identity and access management across its Next.js frontend and Go backend. The team needs centralized account management, authentication, and role assignment to control access to safety-monitoring information and application functions. Keycloak provides an established identity platform, and its selection also builds on existing Keycloak knowledge or infrastructure available to the team. Decision Use Keycloak as the centralized identity provider, with OpenID Connect for application authentication. Manage application roles and user-role assignments in Keycloak, and configure access tokens to include the relevant role claims. The Go backend will validate access tokens and enforce role-based authorization before executing protected API operations. Specific role names and the permission matrix will be defined separately. Status Accepted Consequences Positive Centralizes account management, authentication, and role assignment for the frontend and backend. Reduces the amount of custom identity-management functionality the team must develop and maintain. Reuses the team's existing Keycloak experience or available setup, reducing initial adoption effort. Establishes backend authorization checks that apply consistently to protected API requests. Keeps identity administration separate from the application's safety-monitoring business logic. Negative Introduces an identity-service dependency that requires configuration, maintenance, monitoring, and backup. Client configuration, token settings, and role mappings must remain consistent with the application's access requirements. The backend must implement and maintain operation-level authorization rules aligned with Keycloak role assignments.", "s": 20, "hidden": false}, {"n": 249, "t": "Architecture Decision Record (ADR) 5", "x": "249 Architecture Decision Record (ADR) 5 Separation of Telemetry Events and Media Uploads Context Large media files could use too much CPU and memory in Kafka. Telemetry and uploaded files can become available at different times. Decision Send small telemetry messages directly to Kafka. Upload media through Go to RustFS, then publish file references to Kafka. The Aggregator matches both events by sampleId and stores telemetry and objectKeys in one PostgreSQL record. Mark it ready when all required data is available. Positive Smaller Kafka messages and immediate telemetry delivery. Persistent aggregation state and shared media access. Negative Handle duplicates, missing uploads and event publication failures. Complete samples must wait for uploads. Storage and network demand remain. Accepted", "notes": "Source: ADR.docx provided by the user. ADR-005: Separation of Telemetry Events and Media Uploads Title Separation of Telemetry Events and Media Uploads Context The RoboTaxi mock data streamer simulates vehicle feeds by releasing telemetry, camera data, and point clouds together. Sending large media files through Kafka could use too much CPU and memory, slowing down the system. Storing media separately introduces different arrival times, so the system needs a reliable way to associate telemetry with its corresponding files. Decision Send small telemetry messages directly to Kafka. Upload large images, videos, and point clouds through the Go backend to RustFS first, then publish their file references to Kafka. The Aggregator consumes both event types and uses a shared sampleId to store telemetry and file references in the same PostgreSQL record. Once telemetry and all required file references are available, the record is marked as ready for pipeline processing. Status Accepted Consequences Positive Smaller Kafka messages. Kafka carries telemetry and media references, reducing the volume of data handled by the messaging layer. Immediate telemetry delivery. Telemetry can enter Kafka while media uploads are still in progress. Support for different arrival times. The shared sampleId allows the Aggregator to associate events regardless of which arrives first. Persistent aggregation state. PostgreSQL stores partially assembled samples, allowing aggregation to continue after a worker restart. Shared media storage. Processing pipelines can retrieve the required files from RustFS using stored object references. Negative Additional coordination logic. The Aggregator must track received assets, update sample status, and handle duplicate events safely. Media-dependent processing delay. Pipelines requiring a complete sample must wait for all required uploads to finish. Partial samples require handling. Failed uploads or missing events can leave samples pending, requiring retries and a timeout policy. Upload and event publication can fail separately. Recovery must cover cases where a file is stored successfully but its MediaReady event is not published. Resource demand shifts to storage and processing. The backend, RustFS, network, and processing pipelines still need capacity to transfer and process the media files.", "s": 20, "hidden": false}, {"n": 250, "t": "Timeline", "x": "Timeline", "notes": "", "s": 21, "hidden": false}, {"n": 251, "t": "Roadmap First Semester(1/3)", "x": "251 Roadmap First Semester(1/3)", "notes": "", "s": 21, "hidden": false}, {"n": 252, "t": "Roa const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bySlide = Object.fromEntries(D.slides.map(s => [s.n, s]));
let filter = null;   // {label, slides:[n...]}
let shown = [];      // slide numbers currently in the grid
let scope = "all";   // all | main | app - combines with search and sidebar filter
document.querySelectorAll("#scope button").forEach(b => b.onclick = () => {
  scope = b.dataset.v;
  document.querySelectorAll("#scope button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

// sidebar
const nav = $("#nav");
const btn = (label, right, f) => {
  const b = document.createElement("button");
  b.innerHTML = `<span>${esc(label)}</span><small>${right}</small>`;
  b.onclick = () => { filter = f; $("#q").value = ""; render(); nav.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); nav.classList.remove("show"); scrollTo(0, 0); };
  return b;
};
const h = t => { const e = document.createElement("h2"); e.textContent = t; nav.append(e); };
const all = btn("All slides", D.slides.length, null); all.classList.add("on"); nav.append(all);
h("Likely questions");
D.questions.forEach(q => nav.append(btn(q.q, q.slides.length, {label: q.q, slides: q.slides})));
h("Main deck");
D.sections.filter(s => !s.app).forEach(s => nav.append(btn(s.name, `${s.from}–${s.to}`, sec(s))));
h("Appendix");
D.sections.filter(s => s.app).forEach(s => nav.append(btn(s.name, `${s.from}–${s.to}`, sec(s))));
function sec(s){ const a = []; for (let i = s.from; i <= s.to; i++) a.push(i); return {label: s.name, slides: a}; }

function snippet(s, terms){
  const src = s.x + " " + s.notes, low = src.toLowerCase();
  const i = Math.max(0, low.indexOf(terms[0]));
  let out = esc(src.slice(Math.max(0, i - 50), i + 110));
  terms.forEach(t => { out = out.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`); });
  return (i > 50 ? "…" : "") + out + "…";
}

function render(){
  const terms = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  let list = filter ? filter.slides.map(n => bySlide[n]).filter(Boolean) : D.slides;
  if (terms.length) {
    list = D.slides.filter(s => { const hay = (s.t + " " + s.x + " " + s.notes + " " + D.sections[s.s].name + (D.sections[s.s].app ? " appendix" : " main")).toLowerCase(); return terms.every(t => hay.includes(t)); });
  }
  if (scope !== "all") list = list.filter(s => D.sections[s.s].app === (scope === "app"));
  shown = list.map(s => s.n);
  const what = (terms.length ? `matching “${esc(terms.join(" "))}”` : filter ? `for <b>${esc(filter.label)}</b>` : "") + (scope === "all" ? "" : ` in <b>${scope === "app" ? "Appendix" : "Main deck"}</b>`);
  $("#status").innerHTML = `${list.length} slide${list.length === 1 ? "" : "s"} ${what}` + (list.length ? ` — numbers: <b>${compact(shown)}</b>` : "");
  $("#grid").innerHTML = list.map(s => `
    <div class="card" data-n="${s.n}">
      <div class="thumb"><img loading="lazy" src="thumbs/${s.n}.jpg" alt=""><span class="num">${s.n}</span>${s.hidden ? '<span class="tag">hidden</span>' : ""}</div>
      <div class="meta"><div class="t">${esc(s.t)}</div><div class="s">${D.sections[s.s].app ? '<span class="chip">Appendix</span>' : '<span class="chip main">Main</span>'}${esc(D.sections[s.s].name)}</div>${terms.length ? `<div class="snip">${snippet(s, terms)}</div>` : ""}</div>
    </div>`).join("");
}
function compact(ns){ // 5,6,7,9 -> 5–7, 9
  const out = []; let a = ns[0], b = ns[0];
  for (const n of ns.slice(1).concat(null)) { if (n === b + 1) { b = n; continue; } out.push(a === b ? a : `${a}–${b}`); a = b = n; }
  return out.join(", ");
}

// modal
let cur = null;
function open(n){ cur = n; const s = bySlide[n]; $("#modal img").src = `thumbs/${n}.jpg`; $("#modal b").textContent = n; $("#modal span").textContent = s.t; $("#modal").classList.add("open"); }
function step(d){ const i = shown.indexOf(cur) + d; if (i >= 0 && i < shown.length) open(shown[i]); }
$("#grid").onclick = e => { const c = e.target.closest(".card"); if (c) open(+c.dataset.n); };
$("#modal").onclick = e => { const d = e.target.dataset.d; if (d === "0" || e.target.id === "modal") $("#modal").classList.remove("open"); else if (d) step(+d); };
document.addEventListener("keydown", e => {
  if ($("#modal").classList.contains("open")) {
    if (e.key === "Escape") $("#modal").classList.remove("open");
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  } else if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
$("#q").oninput = render;
$("#navtoggle").onclick = () => nav.classList.toggle("show");
render();
</script>
