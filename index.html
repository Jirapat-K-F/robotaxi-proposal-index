<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--mute:#5f6b7a;--line:#e2e6eb;--accent:#d0457a;--accent-ink:#fff;--chip:#fbe9f0;--hl:#ffe58a}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--panel:#1b1e23;--ink:#e8eaed;--mute:#9aa4b1;--line:#2c3138;--accent:#e9659a;--accent-ink:#111;--chip:#3a2230;--hl:#6b5a12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;white-space:nowrap}
#q{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{color:var(--mute);font-size:13px}
.hint kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace;background:var(--bg)}
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 58px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto;position:sticky;top:58px;height:calc(100vh - 58px)}
nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 6px 6px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--chip);color:var(--accent);font-weight:600}
nav button small{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
main{padding:16px;min-width:0}
#status{color:var(--mute);margin:0 0 12px;font-size:14px}
#status b{color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;left:8px;top:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:20px;padding:2px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.tag{position:absolute;right:8px;top:8px;background:#000a;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.meta{padding:8px 10px}
.meta .t{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .s{color:var(--mute);font-size:12px;margin-top:2px}
.meta .snip{font-size:12px;color:var(--mute);margin-top:4px}
mark{background:var(--hl);color:inherit;border-radius:2px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:6px;background:var(--chip);color:var(--accent)}
.chip.main{background:var(--line);color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--bg);color:var(--ink);padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
#modal{position:fixed;inset:0;background:#000d;display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal img{max-width:100%;max-height:calc(100vh - 110px);border-radius:6px;background:#fff}
#modal .bar{color:#fff;display:flex;gap:14px;align-items:center;margin-top:10px;max-width:100%}
#modal .bar b{font-size:28px;color:var(--accent)}
#modal .bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal button{font:inherit;background:#fff2;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
#navtoggle{display:none}
@media (max-width:800px){
  .wrap{grid-template-columns:1fr}
  nav{position:static;height:auto;max-height:50vh;border-right:0;border-bottom:1px solid var(--line);display:none}
  nav.show{display:block}
  #navtoggle{display:inline-block;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .hint{display:none}
  #grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
</style>

จฉริยะที่กำหนด, 2580 ขยายการใช้งานตามลำดับชั้นถนน Sources: [30] Faculty of Engineering, Chulalongkorn University, 2022. https://www.eng.chula.ac.th/th/34771 [1] TDRI, Strategic Roadmap for CAV governance, report to the Department of Land Transport, Oct. 2024 (Fig. 6.2). https://tdri.or.th/wp-content/uploads/2026/02/2024_10_HRS_570603_cav.pdf", "s": 0, "hidden": false}, {"n": 6, "t": "1.1 Background & Motivation (2/2)", "x": "1.1 Background & Motivation (2/2) 6 Testing is only the start: in-service monitoring is expected THAILAND · LEVEL 4 FIELD TEST >20 designed edge-case scenarios + First Level 4 CAV field test in Thailand, at Rayong (Sep 2026), led by the Department of Science Service (DSS). Data collected to inform testing criteria and policy recommendations. SINGAPORE · PUNGGOL SHUTTLES Figure 2: Grab autonomous shuttle service in Punggol, Singapore. Image: Grab Singapore Press Centre, 29 Jul 2026. >25,000 km autonomous driving as of 27 Feb 2026. LTA will keep monitoring shuttle performance. EU · REGULATION (EU) 2022/1426 Collect data Processes to collect vehicle and other relevant data to monitor and analyse safety-related incidents 1 Notify at once Immediate notification of safety-critical occurrences 2 Report annually Annual reporting on specified occurrences 3 These requirements concern monitoring and reporting capability, not a prescribed software platform. Takeaway: in-service evidence remains necessary after initial testing.", "notes": "โดยในประเทศไทย ได้มีทดสอบยานยนต์ระดับ 4 ครั้งแรกที่ระยอง เดือนกันยายนที่ผ่านมาโดยกรมวิทยาศาสตร์บริการ  และได้มีการศึกษา use case การดำเนินการ CAV จากต่างประเทศเช่น ประเทศสิงคโปร์ ที่ได้ทดสอบรถ shuttle ด้วยระยะสะสมขับอัตโนมัติมากกว่า 25,000 กม. ระบุว่าจะติดตามสมรรถนะอย่างใกล้ชิดต่อไป รวมถึง use case จากสหภาพยุโรป ที่มีข้อบังคับกำหนดให้ผู้ผลิตมีกระบวนการเก็บข้อมูลเพื่อติดตามและวิเคราะห์เหตุการณ์ด้านความปลอดภัย แจ้งเหตุวิกฤตทันที และรายงานเหตุการณ์ที่กำหนดทุกปี ซึ่งจากข้อมูลชี้ให้เห็นถึงความตระหนักด้าน CAV ของประเทศไทยที่ได้ทดสอบและนำ use case ของต่างประเทศมาประยุกต์ใช้ ===== [1.1 Background & Motivation, 2/3 | ~50 s] การทดสอบเป็นเพียงจุดเริ่มต้น ในไทย กรมวิทยาศาสตร์บริการ (DSS) ทดสอบยานยนต์ระดับ 4 ครั้งแรกที่ระยอง เดือนกันยายน 2569 มีสถานการณ์ edge case ที่ออกแบบไว้มากกว่า 20 สถานการณ์ และใช้ข้อมูลที่เก็บได้เป็นฐานของเกณฑ์ทดสอบและข้อเสนอเชิงนโยบาย [2] ต่างประเทศ: สิงคโปร์ รถ shuttle ที่ Grab ดำเนินการใน Punggol สะสมระยะขับอัตโนมัติมากกว่า 25,000 กม. ณ 27 ก.พ. 2569 และ LTA ระบุว่าจะติดตามสมรรถนะอย่างใกล้ชิดต่อไป [3] สหภาพยุโรป ข้อบังคับ 2022/1426 กำหนดให้ผู้ผลิตมีกระบวนการเก็บข้อมูลเพื่อติดตามและวิเคราะห์เหตุการณ์ด้านความปลอดภัย แจ้งเหตุวิกฤตทันที และรายงานเหตุการณ์ที่กำหนดทุกปี [4] ทั้งหมดเป็นข้อกำหนดด้านความสามารถในการติดตามและรายงาน ไม่ได้กำหนดซอฟต์แวร์เฉพาะ สรุป: หลักฐานหลังเริ่มใช้งานยังจำเป็นต่อเนื่องหลังการทดสอบเบื้องต้น Sources: [2] Department of Science Service, News 378/2569, 16 Sep 2026. https://www.dss.go.th/index.php/dssnews/4041-378-2569 [3] Land Transport Authority, \"Autonomous Shuttle Services in Punggol Open for Public Rides from 1 April 2026,\" 4 Mar 2026. https://www.lta.gov.sg/content/ltagov/en/newsroom/2026/3/news-releases/autonomous-shuttle-services-in-punggol-open-for-public-rides-fro.html [4] Commission Implementing Regulation (EU) 2022/1426, OJ L 221, 26 Aug 2022. https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=celex:32022R1426 Photo: Grab Singapore Press Centre, \"Grab set to pilot on-demand autonomous vehicle service in Punggol,\" 29 Jul 2026 (image carried over from the previous version of this deck).", "s": 0, "hidden": false}, {"n": 7, "t": "1.2 Problem Statement (1/2)", "x": "1.2 Problem Statement (1/2) 7 PROBLEM STATEMENT How can vehicle operational records be turned into interpretable safety indicators, while keeping traceable links between source data, assessment results and event evidence? Driving records Timestamp, speed, position, plus interaction or road-context data Safety indicators Surrogate safety measures computed from trajectories Event evidence Source observations and context linked to each event Regulator review Examine how each assessment was derived Traceability: a flagged event must lead back to its data and assessment criteria WHY IT IS HARD Consistent input definitions Time, speed and position must mean the same thing across sources 1 Temporal and spatial alignment Timestamps and positions must be aligned before events are interpreted 2 Justified assessment criteria Thresholds need a stated, research-supported rationale 3 ! Missing or inconsistent inputs change both the calculated indicator and the interpretation of the event.", "notes": "ทางโครงงาน ได้ตั้งปัญหาเชิงวิศวกรรมของโครงการไว้ว่า เราจะแปลงบันทึกการทำงานของยานยนต์ให้เป็นตัวชี้วัดความปลอดภัยที่ตีความได้อย่างไร โดยรักษาความเชื่อมโยงที่ตรวจสอบย้อนกลับได้ระหว่างข้อมูลต้นทาง ผลการประเมิน และหลักฐานของเหตุการณ์ เพื่อความปลอดภัยในการใช้รถใช้ถนนครับ ==== [1.2 Problem Statement, 1/2 | ~60 s] ปัญหาเชิงวิศวกรรมของโครงการ: จะแปลงบันทึกการทำงานของยานยนต์ให้เป็นตัวชี้วัดความปลอดภัยที่ตีความได้อย่างไร โดยรักษาความเชื่อมโยงที่ตรวจสอบย้อนกลับได้ระหว่างข้อมูลต้นทาง ผลการประเมิน และหลักฐานของเหตุการณ์ มากกว่าการเก็บและแสดง log: timestamp ความเร็ว พิกัด ต้องประมวลผลร่วมกับข้อมูลปฏิสัมพันธ์ระหว่างยานพาหนะหรือบริบทถนนตามที่ตัวชี้วัด surrogate safety แต่ละตัวต้องการ [5] ซึ่งต้องมี (1) นิยามข้อมูลนำเข้าที่สอดคล้องกัน (2) การจัดแนวข้อมูลเชิงเวลาและพื้นที่ (3) เกณฑ์การประเมินที่อธิบายเหตุผลได้ หากข้อมูลขาดหรือไม่สอดคล้องกัน ทั้งค่าที่คำนวณและการตีความเหตุการณ์จะคลาดเคลื่อน ผู้กำกับดูแลจึงต้องย้อนจากเหตุการณ์ไปถึงข้อมูลและเกณฑ์ได้ [1] Sources: [1] TDRI, Strategic Roadmap for CAV governance, Oct. 2024. https://tdri.or.th/wp-content/uploads/2026/02/2024_10_HRS_570603_cav.pdf [5] D. Gettman, L. Pu, T. Sayed, S. G. Shelby, Surrogate Safety Assessment Model and Validation: Final Report, FHWA-HRT-08-051, Jun. 2008. https://rosap.ntl.bts.gov/view/dot/", "s": 0, "hidden": false}, {"n": 8, "t": "1.2 Problem Statement (2/2)", "x": "1.2 Problem Statement (2/2) 8 A prototype that keeps each indicator linked to its source observations THE PROTOTYPE INTEGRATES Driving-data processing 1 Safety-metric computation 2 Event visualization 3 Evidence retrieval 4 Every indicator stays linked to its source observations EVALUATION  ·  nuScenes replay + controlled test cases Metric computation correctness ✓ Event identification ✓ Evidence linkage ✓ System performance ✓ The evaluation establishes the prototype’s capabilities and limitations within the available data and the defined test scope. It supports the Center’s robotaxi research and Thailand’s preparation for autonomous vehicles. Figure 3: nuScenes sample scene with camera, radar and LiDAR views and map context.", "notes": "โครงงานจึงพัฒนาต้นแบบแพลตฟอร์มที่เชื่อมองค์ประกอบสำคัญสี่ส่วน ได้แก่ การประมวลผลข้อมูลการขับขี่ การคำนวณตัวชี้วัดความปลอดภัย การแสดงผลเหตุการณ์ และการเรียกดูหลักฐานประกอบ โดยรักษาความเชื่อมโยงระหว่างตัวชี้วัดกับข้อมูลต้นทาง เพื่อให้ผู้กำกับดูแลทบทวนย้อนหลังได้อย่างโปร่งใส และได้ออกแบบกรณีทดสอบที่ควบคุมได้ โดยการวัดสี่ด้าน: ความถูกต้องของการคำนวณตัวชี้วัด การระบุเหตุการณ์ ความเชื่อมโยงหลักฐาน และสมรรถนะของระบบ ====== [1.2 Problem Statement, 2/2 | ~40 s] โครงการจึงพัฒนาต้นแบบแพลตฟอร์มที่เชื่อมสี่ส่วน ได้แก่ การประมวลผลข้อมูลการขับขี่ การคำนวณตัวชี้วัดความปลอดภัย การแสดงผลเหตุการณ์ และการเรียกดูหลักฐานประกอบ โดยรักษาลิงก์ระหว่างตัวชี้วัดกับข้อมูลต้นทาง เพื่อให้นักวิจัยและผู้กำกับดูแลทบทวนย้อนหลังได้อย่างโปร่งใส ประเมินด้วยการ replay ชุดข้อมูลสาธารณะ nuScenes [14] และกรณีทดสอบที่ควบคุมได้ โดยวัดสี่ด้าน: ความถูกต้องของการคำนวณตัวชี้วัด การระบุเหตุการณ์ ความเชื่อมโยงหลักฐาน และสมรรถนะของระบบ ผลที่ได้จะระบุทั้งความสามารถและข้อจำกัดของต้นแบบภายในขอบเขตข้อมูลและการทดสอบที่กำหนด เป็นฐานทางเทคนิคสำหรับงานวิจัย robotaxi ของศูนย์ และการเตรียมความพร้อมด้านยานยนต์อัตโนมัติของประเทศ Sources: [14] H. Caesar et al., \"nuScenes: A multimodal dataset for autonomous driving,\" CVPR 2020, pp. 11621-11631. Scope and evaluation plan: project proposal, secs. 1.1-1.2.", "s": 0, "hidden": false}, {"n": 9, "t": "1.3 Objectives", "x": "9 1.3 Objectives Safety Metrics 2. Data Pipeline 3. Safety Database 4. AI Agents 5. Web Dashboard Develop a Robotaxi safety monitoring system that helps regulators access, analyze and interpret safety information. Calculate safety indicators from trajectories and sensor data. Validate and process sensor data with streaming and batch workflows. Store telemetry, metrics and events for traceable historical analysis. Query and analyze data in natural language, and draft incident reports. Explore trajectories, safety indicators, events and camera images.", "notes": "The objective of this project is to develop a system that supports Robotaxi safety monitoring and regulatory review by integrating driving data processing, interactive visualization, and AI agents to help regulatory user access, analyze, and interpret safety information. To achieve this, the project is divided into the following components: 1. Safety Metric Calculation System to calculate driving safety indicators, from available vehicle trajectories and sensor data for further analysis. 2. Data Pipeline to ingest, validate, transform, and process multi-sensor driving data through streaming and batch processing workflows. 3. Safety Information Database to store processed telemetry, safety indicators, and event records, supporting historical access, traceability, and analysis. 4. AI Agent Integration to support natural-language queries for retrieving and analyzing system data, and to generate incident report based on relevant safety indicators and supporting evidence. 5. Web Dashboard to visualize vehicle information, safety indicators, and relevant events through an interactive interface displaying driving trajectories, sensor information, and associated camera images.", "s": 0, "hidden": false}, {"n": 10, "t": "1.4 Scope", "x": "10 1.4 Scope 01  Monitoring platform Vehicle data, safety indicators, incident timelines and supporting evidence. 02  Scenario replay Replay recorded driving scenarios with synchronized sensor data. 03  Safety metric pipelines Streaming and batch calculations from valid inputs, plus historical analysis. 04  Access control Role-based and vehicle-level permissions for system data and AI tools. 05  AI assistance Natural-language data searching, analysis and evidence-based incident report drafts. 06  System evaluation Correctness, AI tasks, traceability, permissions, processing latency and usability on recorded and synthetic data.", "notes": "1. Design and implement a safety monitoring platform for regulatory users, including vehicle information, safety indicator visualizations, incident timelines, and access to supporting data. 2. Design and implement a data replay service to reproduce recorded driving scenarios and their associated data for safety monitoring, visualization, and analysis. 3. Design and implement streaming and batch processing pipelines to calculate industry standard and evidence based safety metrics and support historical analysis, subject to the availability and validity of the required inputs. 4. Implement role-based access control and vehicle-level permissions to restrict access to system data and AI agent tools according to user responsibilities. 5. Integrate AI agents into the platform to support natural-language queries for retrieving and analyzing system data, and to generate incident report drafts based on relevant safety indicators and supporting evidence. 6. Evaluate the system in terms of calculation correctness, AI agent task performance, evidence traceability, access control, processing latency, and usability using recorded data and controlled synthetic test cases.", "s": 0, "hidden": false}, {"n": 11, "t": "1.5 Limitations", "x": "11 1.5 Limitations 01  Dataset coverage Initial dataset: nuScenes (USA and Singapore). Limited transferability to Thai traffic. 02  Replayed telemetry Recorded streams do not fully capture fleet delays, sensor failures or operational variability. 03  Input availability Metrics require reliable inputs. Missing evidence means unavailable metrics. 05  AI reliability Models, tools and data constrain results. Users must verify consequential interpretations. 06  Project boundaries Excludes vehicle control, booking, payments, dispatch optimization and emergency intervention. 04 No real time calculation Safety metrics are not calculated in real time, so the results are not immediately available for display or further use.", "notes": "1. Comprehensive autonomous driving datasets from Thailand containing camera, LiDAR, and other sensor data required for safety metric evaluation are limited. Therefore, nuScenes, which includes driving scenarios from the USA and Singapore, is selected as the initial dataset for development and evaluation. Results derived from this dataset may have limited applicability to Thailand’s traffic conditions. Additional datasets may be incorporated as they become available. 2. The system will use recorded data replayed to simulate telemetry streams. Consequently, the evaluation will not fully represent the communication delays, sensor failures, and operational variability of a deployed Robotaxi fleet. 3. Safety metrics can be calculated only when the required trajectory, velocity, timing, and geometric information is available and sufficiently reliable. Missing or unsuitable inputs will result in unavailable metrics rather than values estimated without supporting evidence. 4. AI agent capabilities will be limited by the selected models, available tools, and accessible data. Generated responses may contain errors or incomplete interpretations and will require user verification when used to support consequential decisions. 5. The project focuses on monitoring, analysis, and AI-assisted interaction with safety information. Autonomous vehicle control, passenger booking, payment, dispatch optimization, and emergency intervention are outside its scope.", "s": 0, "hidden": true}, {"n": 12, "t": "1.5 Expected Benefits", "x": "12 1.5 Expected Benefits 01  Driving insights Understand safety indicators, trajectories and driving events. 02  Regulatory review Investigate potential hazards and access evidence in one platform. 03  AI-assisted access Use AI for natural-language searching, analysis and summaries. 04  Reusable architecture Extend the data pipeline, storage and visualization for future studies. 05 Research & Educational Value Providing a practical environment for evaluating safety metrics, data pipelines, and AI agents.", "notes": "1. Improving understanding of Robotaxi driving behavior by providing safety indicators, vehicle trajectories, and event information to support safety analysis. 2. Supporting regulatory review by enabling users to monitor safety information, explore potentially hazardous events, and access relevant evidence through a unified platform. 3. Improving access to safety information by integrating AI agents that assist users with natural-language queries, data analysis, and summarization. 4. Establishing a reusable system architecture for collecting, processing, storing, and visualizing multi-sensor driving data to support future applications and studies. 5. Providing educational and research value by serving as a practical case study and experimental platform for evaluating safety metrics, data processing pipelines, and AI agents.", "s": 0, "hidden": false}, {"n": 13, "t": "Review of Existing Knowledge", "x": "Review of Existing Knowledge Computer Engineering | Chulalongkorn University", "notes": "", "s": 1, "hidden": false}, {"n": 14, "t": "2.1 Review of Existing Knowledge (1/4)", "x": "2.1 Review of Existing Knowledge (1/4) How is the safety of self-driving cars measured within the industry? TTC Time-to-Collision Seconds left before a crash if nobody reacts PET Post-Encroachment Time Gap between one road user leaving a spot and the next one arriving 14 DRAC Deceleration Rate to Avoid Crash How hard do you need to brake to avoid a collisio ng | Chulalongkorn University", "notes": "", "s": 2, "hidden": false}, {"n": 24, "t": "System Overview (1/2)", "x": "24 System Overview (1/2) Firstly, telemetry and footage from the ego-vehicle is transformed and preprocessed to be nuScenes-compatible format. 1 2 3", "notes": "ต่อไปเป็นการออกแบบระบบของโครงงานโดยสัปเขปครับ ซึ่งจากการศึกษา use case ในการกำกับดูแลและระบบ in-service monitoring รวมถึงการศึกษาตัวชี้วัดมาตรฐานความปลอดภัยในการใช้รถใช้ถนน ตัวระบบจึงได้แบ่งออกเป็นสองส่วนหลักๆ ได้แก่ 1. ส่วนของ Data processing ที่จะนำ raw data ที่เก็บรวบรวม raw data จาก sensor ของตัวรถ และเตรียมเข้าสู่การคำนวณตัวชี้วัดมาตรฐาน ซึ่งโครงงานจะใช้ nuScene public dataset เป็นหลักครับ", "s": 2, "hidden": false}, {"n": 25, "t": "System Overview (2/2)", "x": "25 System Overview (2/2) Preprocessed data then forwarded through safety metric calculation pipeline and eventually passed to Agentic-AI tasks to process and present outputs on the dashboard. 4 3 5 6", "notes": "ส่วนต่อมาจะเป็น matric calculation, agentic use case และ dashboard and monitoring ครับ ซึ่ง safety matric ที่ได้จากการคำนวณจะถูกใช้ใน 2 ส่วนหลักๆ ได้แก่ หมายเลข 5 ซึ่งเป็นส่วนของ agentic use case ซึ่งประกอยไปด้วย incident report และ natural language search ครับ รวมถึงจะถูกแสดงในส่วนหมายเลข 6 เพื่อการกำกับดูแลในส่วน dashboard & monitoring ครับ", "s": 2, "hidden": false}, {"n": 26, "t": "Components", "x": "26 Components - AMD Ryzen 9 9950x – 16c 32t 4.3-5.7GHz (AMD socket am5) CPU - MSI MPG X870e Carbon WiFi (AMD socket am5 DDR5 Atx) Motherboard - Gigabyte Geforce RTX 5090 Windforce Oc 32g – 32GB GDDR7 (gv-n5090wf3oc-32gd) - 128GB (32GBx4) DDR5 5600MHz Corsair Vengeance RGB DDR5 (intel Xmp) RAM - 6TB 3.5 Inch WD Black 7200RPM SATA3 HDD - 4TB Samsung 9100 Pro – PCIE 5x4 NVME M.2 2280 SSD - Corsair AX1600i – 1600w 80 Plus Titanium Black ATX power supply - CPU Air cooler “Be quiet Dark Rock Pro 5” - Antec Performance 1 Ft (black) e-atx case Server Sensors", "notes": "ส่วนต่อมาจะเป็นในส่วนขององค์ประกอบหลัก ๆ นั้นจะมีอย่าองส่วน ได้แก่ server และ sensors โดย spec ของเครื่อง server จะมีดังนี้", "s": 2, "hidden": false}, {"n": 27, "t": "Components", "x": "27 Components - 1x LIDAR: environment 3D spatial geometry - 5x RADAR: measurement of surrounding object doppler-based speed estimation - 6x Camera: ego-vehicle surround camera - IMU: ego-vehicle trajectory and multi-sensor spatial localization - GPS: ego-vehicle geo-localization Server Sensors Specification derived from the properties of Nuscene dataset: “NuScenes.” Available: https://www.nuscenes.org/nuscenes?tutorial=nuscenes", "notes": "ถัดมาเป็นในส่วนของ sensor โดย sensor ที่ใช้งานหลัก ๆ จะมี LIDAR , RADAR , กล้องรอบคัน, IMU และ GPS โดยข้อมูลทั้งหมดนี้จะเป็นข้อมูลที่อ้างอิงมาจาก sensor ที่มีการเก็บข้อมูลใน dataset NuScene เนื่องจากว่าระบบของเราตอนนี้จะพัฒนาและทดสอบกับข้อมูลที่ sample มาจาก Nuscene dataset เป็นหลัก", "s": 2, "hidden": false}, {"n": 28, "t": "Constraint considered", "x": "28 Constraint considered 1. Performance - Required to process high-throughput 3D LiDAR data without resource exhaustion by embedding observability tools to measure and eliminate latency bottlenecks. 3. Scalability - Required to seamlessly handle dynamic data ingress spikes by deploying a distributed processing platform for concurrent task execution. 4. Usability - Required to enable effortless auditing for non-technical stakeholders by providing a consistent dashboard interface that abstracts complex backend mechanics. 2. Sustainability Required to minimize Mean Time to Change during evolving project needs by engineering a maintainable and future-proof architecture. 5. Generative AI Capability - Required to maintain high data trustworthiness by implementing continuous self-evaluation to catch and mitigate LLM hallucinations 6. Near Real-time latency - Required to balance deep analytical accuracy with prompt system responsiveness by optimizing execution pipelines for near-real-time evaluation.", "notes": "- ในส่วนของ constraint ที่ได้พิจารณามาแล้วก่อนที่จะท For instance, natural language information retrieval, and report generation.", "notes": "สามส่วน ส่วนของการ host model เองซึ่งมาจาก framework และ ollama observability ด้วย ML Flow", "s": 3, "hidden": false}, {"n": 38, "t": "System architecture (detailed)", "x": "38 System architecture (detailed) Backend Service RustFS – store generated files and heavy resource data such as video footage and LiDAR point cloud. Golang – Perform a composition of system functionality into business logic operations.", "notes": "", "s": 3, "hidden": false}, {"n": 39, "t": "System architecture (detailed)", "x": "39 System architecture (detailed) Database system PGSQL (PostgreSQL) – A relational database used to store application data, computed safety metrics, and AI observations.", "notes": "", "s": 3, "hidden": false}, {"n": 40, "t": "System architecture (detailed)", "x": "40 System architecture (detailed) Miscellaneous Prometheus and Grafana Loki – Log aggregator and operation measurement engine for distributed system. Keycloak – self-hosted Identity provider and OAuth framework which supports fine-grained Role-based Access control (RBAC).", "notes": "", "s": 3, "hidden": false}, {"n": 41, "t": "ROLE & TEAMWORK PLAN", "x": "ROLE & TEAMWORK PLAN Computer Engineering | Chulalongkorn University", "notes": "", "s": 4, "hidden": false}, {"n": 42, "t": "ROLES AND RESPONSIBILITIES", "x": "42 ROLES AND RESPONSIBILITIES Amorn P. Jirapat D. Jirapat K. Suttanop C. Peeradon T.", "notes": "", "s": 4, "hidden": false}, {"n": 43, "t": "TEAMWORK PLAN", "x": "43 TEAMWORK PLAN Jirapat D. Web dashboard & UX/UI Observability Jirapat K. AI agent & model benchmarking Data Pipeline Amorn Data Pipelines Database Peeradon Backend services Database Identity & access Suttanop Architecture & deployment Identity & access Data Pipeline All members: integration, evaluation, report & slides Reviewed weekly  ·  tracked in GitHub Issues  ·  reassigned at Thursday recap or Saturday stand-up Bold = main area   · Yellow = shared with a teammate", "notes": "", "s": 4, "hidden": false}, {"n": 44, "t": "TEAMWORK PLAN", "x": "44 TEAMWORK PLAN Thursday Advisor meeting & Sprint Retrospective Saturday Stand up meeting update Tuesday Internal knowledge sharing Wednesday Presentation preparation", "notes": "", "s": 4, "hidden": false}, {"n": 45, "t": "ROADMAP", "x": "ROADMAP Computer Engineering | Chulalongkorn University", "notes": "", "s": 5, "hidden": false}, {"n": 46, "t": "Roadmap (First Semester)", "x": "46 Roadmap (First Semester)", "notes": "", "s": 5, "hidden": false}, {"n": 47, "t": "Roadmap (Second Semester)", "x": "47 Roadmap (Second Semester)", "notes": "", "s": 5, "hidden": false}, {"n": 48, "t": "Inquiries", "x": "48 Inquiries Q&A", "notes": "", "s": 5, "hidden": false}, {"n": 49, "t": "Appendices", "x": "Appendices", "notes": "", "s": 6, "hidden": false}, {"n": 50, "t": "Metrics", "x": "Metrics", "notes": "", "s": 7, "hidden": false}, {"n": 51, "t": "Metric Strategy Overview", "x": "+ + Metric Strategy Overview Prioritizing driving-safety metrics by research value, interpretability, and implementation feasibility. Must-have Metrics Nice-to-have Metrics • PET • TTC / TTC2D • TTLC / TLC • Parking Accuracy • Legal Parking Rate • Regional Obstacle Classification Recall • TTZ • Lane-Splitting Avoidance Rate • PRI • EI • CPI • MSDV • Longitudinal Jerk • AD", "notes": "", "s": 7, "hidden": false}, {"n": 52, "t": "Must Have Safety Metrics", "x": "+ + Must Have Safety Metrics Brief definitions, typical usage, and importance of the metrics Time To Collide (TTC) What it is An estimation of time left before collision between ego-vehicle and the other Use case Useful for an indicator of the collision of the ego-vehicle as it can detect near-hit scenario. Assumption each vehicles are moving at the same speed and the same direction for the time being before and during the incident Post-Encroachment Time (PET) What it is Time difference between two conflicting path crossing at the same conflict zone Use case Useful for the validation of the decision made by ego-vehicle as it can measure the risk from the autonomous driven style Assumption Assume constant trajectory and speed , overlap of two paths and PET=0 means collision happened Visualization of TTC [5] Visualization of PET [2]", "notes": "", "s": 7, "hidden": false}, {"n": 53, "t": "Must Have Safety Metrics", "x": "+ + Must Have Safety Metrics Brief definitions, typical usage, and importance of the metrics Time to lane crossing (TTLC) What it is the predicted time left before a vehicle crosses a road lane boundary Use case Helps in the evaluation of the control stability, observation of the lane departure and helps in the detection of the unintentional drifts Assumption The crossing point projection is assumed based on its current speed and steering angle of the ego-vehicle Time to lane crossing [3]", "notes": "", "s": 7, "hidden": false}, {"n": 54, "t": "Must Have Safety Metrics and their evolution", "x": "+ Must Have Safety Metrics and their evolution Brief definitions, typical usage, and importance of the metrics Time To Collide 2D (TTC2D) What it is A multi-directional TTC which can detect time difference to collision in multi-direction Use case Use to detect the collision risk or near-hit incident from the sideswipe Assumption each vehicles are moving at the same speed and the same direction for the time being before and during the incident and both vehicles have the same heading and that their headings remain unchanged during the manoeuvre Sideswipe collision scenario from [4]", "notes": "", "s": 7, "hidden": false}, {"n": 55, "t": "Must Have Safety Metrics and their evolution", "x": "+ + Must Have Safety Metrics and their evolution Brief definitions, typical usage, and importance of the metrics Modified Time To Collide (MTTC) What it is TTC With relaxation in the constant speed assumption. MTTC utilize acceleration rate to make more realistic measurement Use case Use for the detection of the same objective as TTC but with the consideration about acceleration and deaccerelation Assumption each vehicles are moving at the same speed, same acceleration rate and the same direction for the time being before and during the incident Visualization of TTC [5]", "notes": "", "s": 7, "hidden": false}, {"n": 56, "t": "Nice-to-have Metrics", "x": "+ + Nice-to-have Metrics Advanced metrics that are useful, but often require richer sensing, map context, or clearer definitions. Parking Metrics Perception Quality Advanced Safety Logic • Parking Accuracy • Legal Parking Rate Need: Require parking-zone rules, and accurate stop position. • Regional Obstacle\r\nClassification Recall Require annotated obstacle labels and ground-truth perception evaluation. • TTZ • Lane-Splitting Avoidance Rate • PRI • EI • CPI • MSDV • Longitudinal Jerk • AD Require stronger metric definitions, interaction logic, or richer sensor fusion. Need: Need:", "notes": "", "s": 7, "hidden": false}, {"n": 57, "t": "Advanced Safety Metrics", "x": "+ + Advanced Safety Metrics Brief definitions, typical usage, and key limitations of advanced safety-oriented metrics. Crash Potential Index (CPI) What it is An index estimating whether collision avoidance demand may exceed available braking capability. Use case Useful for ranking high-risk following or cut-in scenarios beyond TTC alone. Limitation Usually model-based and sensitive to assumptions about braking performance, friction, and vehicle dynamics. Minimum Safe Distance Violation (MSDV) What it is Measures how often or how severely the vehicle falls below a defined safe spacing threshold. Use case Useful for monitoring unsafe following behavior and tailgating exposure. Limitation Needs a clear safe-distance definition and reliable lead-vehicle detection or spacing estimates. Longitudinal Jerk What it is The rate of change of longitudinal acceleration over time, indicating how abruptly the vehicle accelerates or brakes. Use case Useful for measuring ride comfort, harsh braking/acceleration, and smoothness. Limitation Sensitive to sensor noise and sampling rate Aggressive Driving (AD) What it is A behavioral indicator describing driving patterns such as excessive acceleration, hard braking, speeding, or abrupt maneuvers. Use case Useful for identifying risky driving behavior, comparing driving styles, and monitoring safety and passenger comfort. Limitation There is no single universal definition or threshold", "notes": "", "s": 7, "hidden": false}, {"n": 58, "t": "Advanced Safety Metrics", "x": "+ + Advanced Safety Metrics Additional advanced metrics that are promising for research, but need clearer definitions or richer contextual data. Lane-Splitting Avoidance Rate What it is Indicates how often the system avoids risky interactions caused by lane-splitting vehicles, especially motorcycles. Use case Useful in mixed-traffic environments where motorcycles frequently filter between lanes. Limitation it needs scenario rules and strong detection / tracking of lateral intrusions. Time-to-Zebra (TTZ) What it is Time remaining until the vehicle reaches the zebra crossing, measured at the moment a pedestrian arrives at the crossing. The critical band reported in the literature is 2–4 seconds.[8] Use case Measuring whether the robotaxi yields at Thai zebra crossings. Limitation low in reliability and low in validity, because it ignores the pedestrian's motion entirely and ignores every other road user. It should be presented as an input to PRI, not as a standalone safety score.", "notes": "", "s": 7, "hidden": false}, {"n": 59, "t": "Advanced Safety Metrics", "x": "+ + Advanced Safety Metrics Additional advanced metrics that are promising for research, but need clearer definitions or richer contextual data. Pedestrian Risk Index ( PRI ) What it is It serves as a numerical indicator of severity for vulnerable road users. Integrates squared impact speed multiplied by the difference between stopping time and TTZ across the whole conflict period. Units: m²/s³.[9] Use case Use PRI as an infrastructure-conditioned acceptance threshold for ODD entry, not just as a behavior score. Limitation Assumes a marked crosswalk and a single pedestrian. It is undefined for mid-block jaywalking, which is the dominant pedestrian conflict type in Bangkok. Emergency Index ( EI ) What it is A two-dimensional surrogate safety measure based on the interaction depth between two vehicles rather than a 1D closing-time assumption. It was designed to fix three failures of earlier 2D-SSMs: incomplete preconditions causing missed conflicts, over-optimistic risk from extending TTC logic into 2D.[7] Use case Lane-filtering / motorcycle cut-in scenarios Limitation EI computes remaining evasion time from vehicle center points, and it has been superseded replaces that with a TTC2D-based term and is validated on 1,548 real autonomous-vehicle conflicts from Argoverse-2 (501 critical, 1,047 potential). Code at github.com/AutoChengh/MEI.", "notes": "", "s": 7, "hidden": false}, {"n": 60, "t": "Dataset", "x": "Dataset", "notes": "", "s": 8, "hidden": false}, {"n": 61, "t": "nuScenes dataset", "x": "nuScenes dataset ● Each scene has 20 second length. ● 1x LIDAR, 5x RADAR, 6x camera, IMU, and GPS ● 1000 scenes of 20s each ● Data collected from Boston Seaport and Singapore’s One North, Queenstown and Holland Village districts ● Left versus right hand traffic ● Detailed map information ● Only snapshot from 2019’s 15h driving log is available ● Annotation for each lidar point is availbe on nuScenes-lidarseg ( 2020 )", "notes": "", "s": 8, "hidden": false}, {"n": 62, "t": "nuScenes dataset", "x": "nuScenes dataset Can use CAN bus extension to extract speed, and IMU sample data", "notes": "", "s": 8, "hidden": false}, {"n": 63, "t": "nuScenes dataset", "x": "nuScenes dataset One-stop dataset for the usage of autonomous vehicle auditing Pros: Good structural and handy development kit Cons: Structure is detailed and need a lot of abstraction. This make the dataset requires steep learning curve. Nuscenes sample pointcloud rendering Cons: no localization for Thai street for now", "notes": "", "s": 8, "hidden": false}, {"n": 64, "t": "nuScenes dataset", "x": "nuScenes dataset Rich features and data for the perception of the car", "notes": "", "s": 8, "hidden": false}, {"n": 65, "t": "nuScenes dataset", "x": "nuScenes dataset Can use CAN bus extension to extract speed, and IMU sample data (experimental)", "notes": "", "s": 8, "hidden": false}, {"n": 66, "t": "nuScenes dataset", "x": "nuScenes dataset Potential metric that can be derived from nuScenes dataset Lidar + IMU + camera We can derive standard mathematical metric such as TTC PET TTLC / TLC Other advanced metrics Can also be derived with the help of annotation on the dataset Minimum Safe Distance Violation (MSDV) Proper Response Action (PRA) Other metrics Sample scene tagging from nuScenes", "notes": "", "s": 8, "hidden": false}, {"n": 67, "t": "Dataset Overview", "x": "Dataset Overview • Combine Thailand context data, perception data, and high-frequency safety data • Use Longdo Probe as the primary Thai dataset • Support regulation, audit, safety, and efficiency analysis 3 Thailand Context Data Longdo Probe, Taxi GPS, MeTS-10 Bangkok Route, speed, congestion, fleet context Perception Data Bangkok Urbanscapes, road-scene datasets Detection, segmentation, road scene understanding Safety-Critical Data High-frequency AV logs, future Thai robo-taxi logs TTC, PET, cut-in, near-miss, event reconstruction 2 1", "notes": "", "s": 8, "hidden": false}, {"n": 68, "t": "Dataset Overview", "x": "Dataset Overview Longdo Traffic Probe Data (Thailand) • Open monthly probe-data archive from Longdo Traffic • Thailand real-world vehicle logs • CSV files, typically one file per day Key fields Vehicle ID: Unique vehicle ID GPS Valid: 1 = enough satellite for GPS fix lat / lon: GPS location up to 5 decimal places timestamp: GPS timestamp ( GMT+7 ) speed: km/h heading: vehicle heading direction [0-360) degree from North=0 for_hire_light: [for taxis] whether \"For Hire\" light is ON 1 = light on  => possibly no passenger 0 = light off => possibly carrying passengers engine_acc: car key status active, can be: 1 (active, the data will be collected every minutes) or 0 (inactive, data collected every 3 minutes) Why it matters • Local Thai traffic context • Large-scale historical coverage • Supports monitoring, audit, and route analytics [1] Longdo Traffic, 'Probe Data Open Archive,' traffic.longdo.com/opendata/probe-data/. [2] Longdo Traffic, 'Probe Data Format,' traffic.longdo.com/docs/probedata-format.", "notes": "", "s": 8, "hidden": false}, {"n": 69, "t": "Use Cases & Dashboard Relevance", "x": "Use Cases & Dashboard Relevance What Longdo Probe Data can support today Suitable Use Cases Dashboard Outputs Route heatmap › Speed analytics › Time-of-day patterns › Fleet utilization view › Audit / regulatory evidence › Raw probe logs derived mobility metrics monitoring dashboard Can derive • trip-level metrics        • road-segment statistics        • speed distribution        • travel-time indicators Most suitable for Mobility monitoring, operational efficiency, and contextual road analytics [1] Longdo Traffic, 'Probe Data Open Archive,' traffic.longdo.com/opendata/probe-data/. [2] Longdo Traffic, 'Probe Data Format,' traffic.longdo.com/docs/probedata-format.", "notes": "", "s": 8, "hidden": false}, {"n": 70, "t": "Suitability & Limitations", "x": "Suitability & Limitations Suitable and limitations of the dataset Suitable ✓ Thailand real-world data ✓ Open and accessible archive ✓ Large historical coverage ✓ Good for route, speed, and mobility analytics ✓ Useful for fleet and audit context ✓ Helpful for contextual risk mapping Limitations ! 1–3 minute sampling interval ! No camera, LiDAR, or radar ! No direct object interaction data ! Not suitable for TTC / PET / Cut-in ! Not suitable for lane-level safety metrics ! Not enough for full ADAS/ADS safety evaluation alone Feasibility snapshot Well supported: route analytics, speed monitoring, congestion context Not supported directly: TTC, PET, DRAC, PMD, lane departure [1] Longdo Traffic, 'Probe Data Open Archive,' traffic.longdo.com/opendata/probe-data/. [2] Longdo Traffic, 'Probe Data Format,' traffic.longdo.com/docs/probedata-format.", "notes": "", "s": 8, "hidden": false}, {"n": 71, "t": "Perception Dataset: Bangkok Urbanscapes", "x": "Perception Dataset: Bangkok Urbanscapes A Thai urban road-scene dataset for semantic segmentation and scene understanding. Collected from Bangkok urban road environments Supports semantic segmentation and scene understanding research Useful for Thai traffic perception, especially motorcycles and pedestrians Strong for model adaptation to local road context Best suited for perception benchmarking rather than safety-event reconstruction Best Use Cases Semantic segmentation Limitations Image-only dataset No trajectory or vehicle dynamics No LiDAR / radar / TTC / PET / cut-in metrics Comparison of qualitative results on the Bangkok Urbanscapes testing set in both the small private and the large roads. We compare our proposed methods of both ResNet-101 and Xception, to other state-of-the-art baseline models which are based on deep convolutional neural networks. Road-scene understanding Thai domain adaptation Motorcycle / pedestrian context", "notes": "Bangkok Urbanscapes is used as the perception layer in the dataset strategy. It supports semantic segmentation and Thai urban road-scene understanding. It is useful for model adaptation to local Thai road context, especially for road, vehicle, motorcycle, pedestrian and footpath classes. It is not suitable for trajectory-based safety metrics such as TTC, PET, DRAC, PMD, cut-in, near-miss, or lane-level behavior analysis because it is an image-only dataset.", "s": 8, "hidden": false}, {"n": 72, "t": "Perception Dataset Waymo", "x": "Perception Dataset Waymo Camera Images: 5 main views (front & sides) recorded at 10 Hz (10 FPS) in high resolution. LiDAR (Point Cloud): High-density data providing accurate 3D representations, even in low light. Labels (Ground Truth): 2D & 3D Bounding Boxes (Vehicles, Pedestrians, Cyclists, Signs). Map Features: Road edges, lanes, and crosswalks overlaid on a global coordinate frame. Format: v1.x uses .tfrecord, v2.0+ uses .parquet (separated Image/LiDAR folders for easy loading).", "notes": "", "s": 8, "hidden": false}, {"n": 73, "t": "Dataset Argoverse 2", "x": "Dataset Argoverse 2 Argoverse 2 is a collection of open-source autonomous driving data and high-definition (HD) maps from six U.S. cities: Austin, Detroit, Miami, Pittsburgh, Palo Alto, and Washington, D.C. This Data was from 2020-2021 Argoverse 2 includes four open-source datasets: Sensor Dataset: contains 1,000 3D annotated scenarios with lidar, stereo imagery, and ring camera imagery. This dataset improves upon the Argoverse 1 3D Tracking dataset. Motion Forecasting Dataset: contains 250,000 scenarios with trajectory data for many object types. Dataset. Motion forecasting addresses the problem of predicting future states (or occupancy maps) for dynamic actors within a local environment. Lidar Dataset: contains 20,000 unannotated lidar sequences. Lidar sweeps are collected at 10 Hz, along with 20 fps imagery from 7 cameras positioned to provide a fully panoramic field of view Map Change Detection Dataset: contains 1,000 scenarios, 200 of which depict real-world HD map changes.", "notes": "", "s": 8, "hidden": false}, {"n": 74, "t": "Dataset Argoverse 2", "x": "Dataset Argoverse 2 Pros: Varity of data Very large data set Have base model in some type of data like TbV Cons: Very big files for all scenarios 1T each type need some where to keep them for 1 year Instructions is complex. Very hard to download partial part of data Nature of data is not look like Thai behavior Computable metric: TTC / TTC2D PET TTLC / TLC TTZ if define it from the crossing geometry plus an agent trajectory EI if compute it from observed trajectories and scene geometry CPI if you also define a braking model and an interaction pair MSDV and MSDF if you define safe-distance and lead-vehicle rules from the tracks Uncomputable matric: PRA Parking Accuracy Legal Parking Rate Lane-Splitting Avoidance Rate Regional Obstacle Classification Recall", "notes": "", "s": 8, "hidden": false}, {"n": 75, "t": "Dataset Wood Scape", "x": "Dataset Wood Scape This dataset for autonomous driving primarily uses four fisheye (surround-view) cameras, which are standard sensors for parking assistance and low-speed driving systems. It includes annotations for semantic segmentation within the vehicle's perimeter radius. WoodScape: A multi-task, multi-camera fisheye dataset for autonomous driving  [6]", "notes": "", "s": 8, "hidden": false}, {"n": 76, "t": "Dataset Wood Scape", "x": "Dataset Wood Scape Suitable Metrics Parking accuracy: The precision of parking correctly. Legal parking rate: Detecting parking space boundaries and no-parking zones. Regional Obstacle Classification Recall: Evaluated within a 360-degree perspective. EI (Emergency Index): Specifically applied to close-proximity situations. Limitation Fisheye camera images contain high distortion, requiring specific calibration techniques or models specifically designed for ultra-wide-angle images. Additionally, it lacks data for high-speed driving on highways.", "notes": "", "s": 8, "hidden": false}, {"n": 77, "t": "Data Feasibility", "x": "Data Feasibility", "notes": "", "s": 8, "hidden": false}, {"n": 78, "t": "Argoverse 2 feasibility", "x": "Argoverse 2 feasibility 78 Metric Compute dataset PET Yes Sensor, Motion Forecasting TTC / TTC2D Yes Sensor, Motion Forecasting TTLC / TLC Yes Sensor, Motion Forecasting Regional Obstacle Classification Recall Yes Sensor CPI Yes Sensor, Motion Forecasting MSDV Yes Sensor, Motion Forecasting Longitudinal Jerk Yes All 4 TTZ (Time-to-Zebra) Yes Sensor, Motion  use and need to be recorded all the time DATA\r\nRECORDER TIME Date & time stamp GPS Latitude / longitude\r\n≥ 2 Hz SPD Vehicle speed\r\n≥ 2 Hz MODE Manual / autonomous /\r\nmanual autonomous / teleoperation OVR Operator override history SNS Sensor data VID Internal + front / rear video Legal obligations 3 YEARS minimum retention from date of recording • Always-on data recorder while the vehicle is used • Recorded information must not be edited • LTA may require data relay, including real-time information • LTA may request copies for investigation, inspection or audit Key idea: regulation creates an evidence trail, not just a dashboard. 87", "notes": "", "s": 9, "hidden": false}, {"n": 88, "t": "OLIVE System: Integrating Vehicle Data with Roadside Cameras for AV Evaluation", "x": "OLIVE System: Integrating Vehicle Data with Roadside Cameras for AV Evaluation Dashboard use case exploration • Singapore CETRAN test monitoring flow AV Autonomous Vehicle AV data / telemetry CCTV Roadside CCTV Seven 360° cameras OLIVE Monitoring & Evaluation\r\nAV data + real-time CCTV LTA LTA Intelligent Transport Systems Centre Central monitoring / evaluation • Real-time CCTV footage is streamed to OLIVE at LTA’s ITSC • OLIVE integrates AV data and CCTV data • Purpose: evaluate readiness of AVs for public use Vehicle evidence + infrastructure evidence for stronger evaluation 88", "notes": "", "s": 9, "hidden": false}, {"n": 89, "t": "LTA AVMS: From Testing to a Monitoring System for Regulatory Oversight", "x": "LTA AVMS: From Testing to a Monitoring System for Regulatory Oversight Dashboard use case exploration • Singapore Evolution of regulatory monitoring 2017 Regulation 17 Data recorder + 3-year retention 2017 CETRAN / OLIVE AV data + 7×360° CCTV 2024 AVMS Call for Solutions Monitor / track / verify AV movement & performance 2025+ Public deployment monitoring Real-time monitoring + performance data collection What LTA explicitly states • AVMS is intended to support LTA’s regulatory work • Goal: safe and reliable deployment / adoption of AVs • AVMS definition: monitor / track and verify movement and performance of AVs deployed in Singapore Our dashboard interpretation • Safety summary and exposure-normalized event rates • Real-time alerts and critical-event triage • Event investigation workspace with evidence replay Key takeaway: the regulator is building monitoring capability not just only collecting logs. 89", "notes": "", "s": 9, "hidden": false}, {"n": 90, "t": "PHASE 1  |  2025–2026", "x": "PHASE 1  |  2025–2026 Foundation: Sandbox + Incentives Expand testing under controlled conditions and safety-case requirements. Build logging, incident reporting, and baseline regulatory processes. ADAS tax incentive policy can help accelerate local data generation. PHASE 2  |  2027–2032 Controlled Deployment of Higher Automation Move toward restricted L3 operation on defined routes such as expressways or controlled ODDs. Progressively test L3/L4 pilots for RoboTaxi, logistics, and Smart City / EEC use cases. Keep deployment ODD-specific and evidence-driven. PHASE 3  |  Toward 2037 Scale According to Road Readiness Broader deployment should follow road hierarchy, infrastructure quality, and digital-map readiness. Increase integration between vehicle capability, connectivity, and regulatory oversight. Target safe expansion to higher automation in more general environments. TESTING DATA SAFETY EVIDENCE REGULATORY MONITORING DEPLOYMENT DECISION Thailand Adaptation Dashboard use case exploration • Singapore 90", "notes": "", "s": 9, "hidden": false}, {"n": 91, "t": "@ China", "x": "@ China Regulation 91", "notes": "", "s": 9, "hidden": false}, {"n": 92, "t": "Dashboard Exploration in China - Overview", "x": "Dashboard Exploration in China - Overview governance/regulatory individual Shenzhen Beijing Shanghai Baidu apollo Figure: Wikipedia | Baidu Apollo linkedin 92", "notes": "", "s": 9, "hidden": false}, {"n": 93, "t": "Shenzhen Intelligent Connected Vehicle Government Supervision Platform", "x": "Shenzhen Intelligent Connected Vehicle Government Supervision Platform Dashboard use case exploration • China Sources: National public service platform for standards information \"Technical requirements for remote service and management systems for connected smart vehicles from Shenzhen Municipal of industry and information technology\" [11] Shenzhen Municipal Intelligent Connected Vehicle Supervision Platform (launched in 2025, upgraded to Version 2.0 in May 2026) Implemented a Centralized Identity Management System for intelligent connected vehicles and autonomous vehicles (pilot version) Shenzhen introduced local standard DB4403/T 363-2023, requiring all L3 and above autonomous vehicles to follow a unified data structure and communication protocol to ensure interoperability with the central dashboard. An AI Inspector system is used to detect driving behavior, analyze accident trends, generate monthly reports, and conduct preliminary responsibility assessments. The standard requires: Vehicles must transmit operational status data to the control center. Operators must maintain a vehicle data management platform. Data formats and communication protocols must be standardized. The platform must support autonomous vehicle safety supervision across Shenzhen. Standard DB4403/T 363-2023 DB4403/T 363.1-2023 — General Requirements DB4403/T 363.2-2023 — On-board Terminal DB4403/T 363.3-2023 — Communication Protocol and Data Format Figure : A self-driving logistics vehicle of SF Express runs on the streets of Shenzhen’s Longang district. [China Daily] 93", "notes": "", "s": 9, "hidden": false}, {"n": 94, "t": "Shanghai ICV Public Data Center", "x": "Shanghai ICV Public Data Center Dashboard use case exploration • China Sources: International Service Shanghai (23 Nov 2022), “Provisions of Pudong New Area of Shanghai Municipality on Promoting the Innovative Application of Driverless Intelligent Connected Vehicles” [12] Data required to be submitted to the Shanghai ICV Public Data Platform: Vehicle position and mileage Driving mode (Autonomous / Manual) Remote control commands Speed, acceleration, and heading System status and fault information 360° video feeds Accident and malfunction records At least 90 seconds of pre-event data Safety Dashboard Regulator Dashboard Lifecycle Dashboard Data Analytics Dashboard Fleet Overview: Active Vehicles Autonomous Trips Total Mileage Driverless Safety Statistics Live Vehicle Map: Real-time location of all vehicles L2 / L3 / L4 automation status Fault and emergency status Autonomous or manual driving mode When an accident occurs, operators must submit incident data to the platform, including at least 90 seconds of pre-crash video footage Key records include: Total testing mileage Number of disengagements Accident history Certification level achieved Licenses and permits obtained Dedicated dashboard for operational and safety data analytics Testing > Demonstration > Pilot Operation Incident Investigation < Commercial Operation", "notes": "", "s": 9, "hidden": false}, {"n": 95, "t": "Beijing High Level Automated Driving Demonstration Area (BHJAD)", "x": "Beijing High Level Automated Driving Demonstration Area (BHJAD) Dashboard use case exploration • China Sources: National Data Administration (22 Jan 2025), “Case Studies of Urban Digital Transformation (Part 46) | Beijing: Building a High-Level Autonomous Driving Demonstration Zone Integrating Vehicles, Roads, Cloud, Network, and Maps\" [13] Operated through the Beijing Chewang Technology platform (state-owned enterprise) Utilize EHUT (Enhanced Ultra High Throughput), a dedicated communication network designed specifically for autonomous vehicles The core architecture of BHJAD consists of: Vehicle Roadside Infrastructure Cloud Platform Key dashboard capabilities include: Roadside Event Feed V2X Alert Dashboard Blind Spot Detection Events Traffic Signal Interaction Monitoring Infrastructure-Assisted Safety Metrics Figure : An autonomous patrol car is seen on the road of the high-level autonomous driving demonstration zone in the Beijing economic-technological development area, January 16, 2024 [CGTN] 95", "notes": "", "s": 9, "hidden": false}, {"n": 96, "t": "Baidu Apollo", "x": "Baidu Apollo Dashboard use case exploration • China Sources: Apollo, “5G cloud chauffeur service solutions” [14] Provides a 5G Remote Driving Service, where trained operators can remotely intervene and control vehicles when they encounter emergencies or edge cases. The remote driving center is equipped with controls equivalent to a real vehicle, including: Force-feedback steering wheel Adjustable-resistance pedals Mechanical emergency brake button Turn signal and horn controls Operators are surrounded by a curved display system that provides a driving experience similar to being inside the vehicle, with strict timestamp synchronization to minimize latency and visual discrepancies 96 Figure : 5G cloud chauffeur remote intelligent cockpit [developer apollo] Figure : Apollo Go's robotaxi [apollo go]", "notes": "", "s": 9, "hidden": false}, {"n": 97, "t": "@ The US of A", "x": "@ The US of A Regulation 97", "notes": "", "s": 9, "hidden": false}, {"n": 98, "t": "Regulation From USA", "x": "Regulation From USA Dashboard use case exploration • USA Sources: MDDI / LTA / NTU / JTC (22 Nov 2017), “Singapore’s First Autonomous Vehicle Test Centre” NHTSA Standing General Order (SGO) 2021 BOTH SAE Level 2 ADAS AND SAE Level 3–5 ADS. Data ADAS vs ADS classification, highest-level automation engagement status during the 30 seconds pre-crash through crash conclusion, ODD status, operator identity, roadway type, weather, crash narrative, injury severity, VRU involvement, property damage, software/hardware/system version fields. California DMV Applies to SAE Level 3+ Mandatory report within 10 days of any collision causing property damage, injury, or death. Publicly posted, redacted per the California Public Records Act. California CPUC aggregated/anonymized pick-up/drop-off (ZIP-level) data. Arizona Law Enforcement Interaction Plan Texas first-responder/law-enforcement interaction plan STATE PROGRAMS FEDERAL PROGRAMS 98", "notes": "", "s": 9, "hidden": false}, {"n": 99, "t": "Regulation From USA", "x": "Regulation From USA Dashboard use case exploration • USA Sources: MDDI / LTA / NTU / JTC (22 Nov 2017), “Singapore’s First Autonomous Vehicle Test Centre” A crash/collision report with a defined trigger and timeline ADS-engagement status at/near the time of the crash. A law-enforcement / first-responder interaction plan Insurance proof Minimal Risk Condition (MRC) capability certification Common : Disengagement-per-mile reporting: essentially unique to California Passenger-service operational data : unique to the California CPUC. State-Police supervision/escort of testing: unique to New York. Public annual legislative summary of AV collisions/violations: distinctive to Washington. Confidential-by-default treatment of all submissions: Nevada (NAC 482A.060), the opposite of California's public-records default. Level 2 ADAS coverage: unique to the federal SGO — no state collects Level 2 crash data as such. Unique : 99", "notes": "", "s": 9, "hidden": false}, {"n": 100, "t": "Dashboard", "x": "Dashboard Dashboard use case exploration • USA Sources: MDDI / LTA / NTU / JTC (22 Nov 2017), “Singapore’s First Autonomous Vehicle Test Centre” 3D scene แบบ real-time ของบริเวณที่รถกำลังวิ่งอยู่ Live feed จากกล้องรอบตัวรถ (exterior cameras) 3D graphical representation ของสิ่งที่รถ perceive ได้ รอบตัว ปุ่ม rewind — ย้อนดู feed ที่บันทึกไว้เพื่อเข้าใจสถานการณ์ก่อนหน้า หน้าจอตอน agent ให้ context กับรถขณะเจอ รถฉุกเฉินกำลังทำงาน Waymo : TeleGuidance – Remote operator that can remotely control car. Zoox and Tesla : 100", "notes": "", "s": 9, "hidden": false}, {"n": 101, "t": "@ Somewhere", "x": "@ Somewhere Regulation 101", "notes": "", "s": 9, "hidden": false}, {"n": 102, "t": "EasyMile (EZFleet)", "x": "EasyMile (EZFleet) French Level 4 AV Developer Core Products: Autonomous passenger shuttle (EZ10) and automated tow tractors (TractEasy). Use Cases: Ideal for public transportation in geofenced areas such as university campuses, airports, industrial parks, and cross-facility logistics. Dashboard Elements: The EZFleet system functions as a Mission Control Center. It focuses on multi-vehicle fleet management, displaying real-time vehicle positions on maps, battery levels, and immediate alerts during interruptions. https://easymile.com/en/technology 102", "notes": "", "s": 9, "hidden": false}, {"n": 103, "t": "Ottopia", "x": "Ottopia Teleoperation Platform (Israel) Platform Goal: A software platform designed for remote control and assistance, allowing humans to safely intervene in AI driving via mobile networks. Use Cases: Acts as a backend system for Robotaxis and autonomous trucks. Operators assist in \"Edge Cases\" where the AI struggles to make decisions, such as construction zones or blocked routes. Dashboard Elements: Highly focused on network engineering. Displays Network Mapping (signal quality), Latency metrics, and features Augmented Reality (AR) UI overlaid onto live video streams. https://www.ottopia.tech/technology 103", "notes": "", "s": 9, "hidden": false}, {"n": 104, "t": "Fernride", "x": "Fernride Germany Developer: Creates autonomous driving and remote control systems tailored for heavy trucks and yard shunting. Use Cases: Ideal for heavy logistics, cargo ports, and container yards requiring high precision on fixed routes. Dashboard Elements: Designed as a hardware-software Teleoperation Center. Utilizes high-resolution multi-screens showing 360-degree live video, paired with physical steering wheels, pedals, and a \"Big Red Button\" for emergencies. https://www.fernride.com/news/fernride-implements-teleoperation-kit-in-terberg 104", "notes": "", "s": 9, "hidden": false}, {"n": 105, "t": "@ Europe", "x": "@ Europe Regulation 105", "notes": "n": 113, "t": "Slide 113", "x": "113", "notes": "", "s": 10, "hidden": false}, {"n": 114, "t": "Slide 114", "x": "114", "notes": "", "s": 10, "hidden": false}, {"n": 115, "t": "Slide 115", "x": "115", "notes": "", "s": 10, "hidden": false}, {"n": 116, "t": "Slide 116", "x": "116", "notes": "", "s": 10, "hidden": false}, {"n": 117, "t": "Thailand Regulatory Proposal", "x": "Thailand Regulatory Proposal", "notes": "", "s": 11, "hidden": false}, {"n": 118, "t": "Key Components of CAV Governance", "x": "Key Components of CAV Governance TDRI-based regulatory synthesis • Connected & Automated Vehicles CAV GOVERNANCE 01  Vehicle & Operation Vehicle standards & testing Trial / deployment approval In-service operation • End-of-life 02  Responsible Actors Driver / User-in-Charge Remote / NUiC operator ADS developer / ASDE 03  Investigation & Liability Evidence collection Accident investigation Liability & insurance 04  Cybersecurity Cyber-risk governance Secure communication Data security & integrity 05  Privacy & Personal Data Purpose limitation Retention & access control Anonymization / privacy 06  Infrastructure Physical infrastructure Digital infrastructure Connectivity / V2X Governance must cover the vehicle, people, data, infrastructure and the full operational lifecycle. Source: TDRI Final Report (2024), Chapter 2, Sections 2.2.1–2.2.6, pp. [2-12]–[2-31] 118 118", "notes": "", "s": 11, "hidden": false}, {"n": 119, "t": "Logging & Data Recording: What Evidence Should Be Recorded?", "x": "Logging & Data Recording: What Evidence Should Be Recorded? TDRI-based regulatory synthesis • Connected & Automated Vehicles TDRI RECOMMENDATION EDR (Event Data Recorder) Records vehicle operation before / around an accident for accident investigation and safety-system analysis. TDRI links EDR to international requirements such as UNR No. 160 and identifies EDR as relevant across SAE Levels 0–5. EDR Vehicle motion / event evidence DSSAD (Data Storage System for Automated Driving ) Records ADS operating history, decisions and interaction between the automated system and the human user. TDRI treats DSSAD as particularly important for SAE Levels 3–5, where the ADS assumes greater responsibility for the DDT. DSSAD ADS state / decision evidence + EDR + DSSAD = physical vehicle behavior + ADS decision history Supporting evidence discussed by TDRI: on-board video • roadside CCTV • real-time infrastructure / environment data Source: TDRI Final Report (2024), Chapter 3, pp. [3-70]–[3-72]; Chapter 8, p. [8-14] 119 119", "notes": "", "s": 11, "hidden": false}, {"n": 120, "t": "Data Retention: Foreign Rules vs Technical Guidance", "x": "Data Retention: Foreign Rules vs Technical Guidance TDRI-based regulatory synthesis • Connected & Automated Vehicles ≥ 3 YEARS Road Traffic (Autonomous Motor Vehicles) Rules 2017 • Data Recorder evidence retained at least 3 years • Trial / operational records remain available for regulatory review ≥ 1 YEAR 90 s minimum pre-accident / pre-failure window TDRI notes requirements for vehicle-state recording, storage, online monitoring and real-time transmission. ≥ 6 MONTHS before deletion or overwrite TDRI cites SAE J3197 guidance to use DSSAD together with EDR for comprehensive automated-driving data logging. Source: TDRI Final Report (2024), Singapore case in Chapter 3; China case, p. [3-51]; Table 3.17, p. [3-72] 120 SINGAPORE & AUSTRALIA CHINA TECHNICAL GUIDANCE 120", "notes": "", "s": 11, "hidden": false}, {"n": 121, "t": "Data Encryption: Protect the Evidence, Not Only the Connection", "x": "Data Encryption: Protect the Evidence, Not Only the Connection TDRI-based regulatory synthesis • Connected & Automated Vehicles 1  Evidence Sources ECU • EDR • DSSAD Vehicle / ADS evidence 2  Encryption AES • RSA • ECC TLS • IPSec 3  Authorized Access Inspection authority Accident investigation authority KEY SIZE ≥ 128 BIT TDRI cites NIST security guidance as an example GRVA-12-11: Access to in-vehicle data TDRI states that access by public authorities requires encryption to protect data from modification. Encryption may begin at ECU / EDR / DSSAD. Data Splitting TDRI describes splitting the data into at least two parts and encrypting at least one part so that only authorized parties can read it. Core objective: confidentiality + integrity of accident evidence. Source: TDRI Final Report (2024), Chapter 3, pp. [3-72]–[3-73], Tables 3.17–3.18 121 121", "notes": "", "s": 11, "hidden": false}, {"n": 122, "t": "Privacy / PDPA / Anonymization: Safety Monitoring With Data Governance", "x": "Privacy / PDPA / Anonymization: Safety Monitoring With Data Governance TDRI-based regulatory synthesis • Connected & Automated Vehicles Purpose Limitation Collect and process data only for purposes consistent with the stated use. Retention & Data Management Define data elements, format, retention period and access arrangements. Anonymization Collect identifiable data only when necessary; reduce identifiability where possible. Secure Handling When identifiable data must be exchanged, use appropriate security / encryption controls. THAILAND GAP IDENTIFIED BY TDRI Thailand has the Personal Data Protection Act B.E. 2562, but TDRI identifies the absence of CAV-specific anonymization criteria and an automotive-sector personal-data guideline. TDRI discusses purpose limitation, data minimization, storage limitation, integrity / confidentiality and anonymization as important principles for CAV data governance. Source: TDRI Final Report (2024), Chapter 3, pp. [3-96]–[3-98]; Chapter 4, pp. [4-48]–[4-49]; Chapter 5, pp. [5-32]–[5-34] 122 122", "notes": "", "s": 11, "hidden": false}, {"n": 123, "t": "Monitoring & Remote Supervision: Three Regulatory Patterns", "x": "Monitoring & Remote Supervision: Three Regulatory Patterns TDRI-based regulatory synthesis • Connected & Automated Vehicles Regulator Monitoring OLIVE CAVs send real-time position and driving status to LTA's Autonomous Vehicle Monitoring and Evaluation System (OLIVE) to verify compliance with trial conditions. Vehicle  →  Real-time Monitoring  →  Regulator Remote Operational Supervision SAO Level 4 Specified Automated Operation (SAO) requires remote monitoring equipment and a trained SAO Supervisor, with duties that include monitoring and accident reporting. Vehicle  →  SAO Supervisor  →  Incident Report Law-Enforcement Interaction LEIP The Law Enforcement Interaction Plan covers remote-operator contact, vehicle / insurance information, safe removal procedures, ADS shutdown verification and ODD information. Vehicle  →  Remote Operator  →  Law Enforcement Monitoring supports three distinct functions: regulatory verification • operational supervision • incident / law-enforcement response Source: TDRI Final Report (2024), Singapore summary p. [3-126]; Japan SAO pp. [3-49] and [3-126]; California pp. [3-63]–[3-64] 123 SINGAPORE JAPAN CALIFORNIA 123", "notes": "", "s": 11, "hidden": false}, {"n": 124, "t": "Key Standards & Metrics: Regulatory Backbone vs Research Analytics", "x": "Key Standards & Metrics: Regulatory Backbone vs Research Analytics TDRI-based regulatory synthesis • Connected & Automated Vehicles TDRI EMPHASIS PROJECT SYNTHESIS REGULATORY / SAFETY ASSURANCE LAYER DDT OEDR ODD DDT Fallback / MRC EDR / DSSAD Type Approval UNECE Regulations RESEARCH-DERIVED SAFETY ANALYTICS TTC   •   PET   •   DRAC   •   other surrogate metrics Useful for: • Near-miss analysis • Conflict severity • Event prioritization • Investigation filtering There is no Thai legal threshold for the specific metrics Source: TDRI Final Report (2024), Chapters 2–3 and Chapter 8; regulatory gap discussion around p. [8-9] 124 124", "notes": "", "s": 11, "hidden": false}, {"n": 125, "t": "UNECE Standards Highlighted by TDRI", "x": "UNECE Standards Highlighted by TDRI TDRI-based regulatory synthesis • Connected & Automated Vehicles TDRI groups the standards into ADAS, ADS and other CAV-related assurance requirements. LAYER 1 ADAS / ACTIVE SAFETY UNR 131 AEBS (Heavy Vehicles) UNR 152 AEBS (Light Vehicles) UNR 79  Steering UNR 140 ESC LAYER 2 AUTOMATED DRIVING UNR 157  Automated Lane Keeping System (ALKS) LAYER 3 LIFECYCLE ASSURANCE UNR 155 Cyber Security / CSMS UNR 156 Software Update / SUMS UNR 160 Event Data Recorder Source: TDRI Final Report (2024), Chapter 4, pp. [4-19]–[4-25]; Chapter 7, pp. [7-60]–[7-61]; Chapter 8, Table 8.1, pp. [8-5]–[8-7] 125 125", "notes": "", "s": 11, "hidden": false}, {"n": 126, "t": "Summary: From Regulation to Evidence-Based Monitoring", "x": "Summary: From Regulation to Evidence-Based Monitoring TDRI-based regulatory synthesis • Connected & Automated Vehicles GOVERNANCE Vehicle • actors liability • cyber privacy • infrastructure EVIDENCE EDR • DSSAD video • roadside context data TRUSTED DATA Retention encryption privacy / anonymization MONITORING Live supervision remote oversight incident response SAFETY ASSURANCE DDT • OEDR ODD • fallback UNECE standards DLT ACTION PLAN ศทส. :Technology / Data Platform TDRI assigns the Information Technology Center a leading role in studying / developing a public-road CAV monitoring system and an internal DLT CAV database, together with cybersecurity and personal-data guidelines. กตส.  :Inspection / Enforcement TDRI assigns the Land Transport Inspection Division a leading role in studying CAV inspection / law-enforcement practices and the technologies needed to prepare enforcement personnel. CAPSTONE POSITIONING  •  A prototype of evidence-based regulatory monitoring — not only a dashboard. Source: TDRI Final Report (2024), Chapter 7 — DLT Action Plan, including pp. [7-33], [7-84]–[7-86]; synthesis across Chapters 2–8 126 126", "notes": "", "s": 11, "hidden": false}, {"n": 127, "t": "Regulations and feature reference", "x": "Regulations and feature reference", "notes": "", "s": 12, "hidden": false}, {"n": 128, "t": "How to read the matrix", "x": "How to read the matrix The matrix compares five areas across six practical category 1 Evidence & data recorders, retention, telemetry, video, integrity 2 Reporting & access collision reports, event packages, regulator access 3 Operational safety faults, fallback, remote stop, minimal-risk manoeuvre 4 ODD & traffic rules geofencing, lawful speed, road-user behaviour 5 Cyber & change security, hardware/software change reporting 6 Testing & oversight deployment tests, dashboards, exposure metrics Strong / Moderate / Limited indicates how explicitly and comprehensively each theme appears in the workbook—not a legal ranking. 128", "notes": "[Sources] - RoboTaxi.xlsx — comparison table (rows 3–52) - Synthesis categories created for presentation readability; they are not legal scores", "s": 12, "hidden": false}, {"n": 129, "t": "Executive comparison", "x": "Executive comparison Insight #1: Singapore and UNECE are the most consistently specified Insight #2: The USA is reporting-led and fragmented Category United States Singapore China UNECE France Evidence & data Moderate Strong Strong Strong Limited Reporting & access Strong Strong Strong Strong Moderate Operational safety Moderate Strong Strong Strong Strong ODD & traffic rules Moderate Strong Strong Strong Moderate Cyber & change Limited Strong Strong Strong Limited Testing & oversight Moderate Strong Strong Strong Limited Read this as regulatory emphasis in the source matrix; jurisdictional detail and maturity differ within each area. 129", "notes": "[Sources] - RoboTaxi.xlsx — comparison table (rows 3–52) - Qualitative presentation synthesis based on explicitness and breadth of entries; not a compliance determination", "s": 12, "hidden": false}, {"n": 130, "t": "United States", "x": "United States A reporting-heavy framework with important state-level variation What stands out • Crash reporting is the most developed area, with federal and state deadlines. • California adds geofencing, first-responder interaction and operational restrictions. • Evidence and cyber requirements are less uniform than in Singapore or UNECE. Regulatory emphasis Evidence & data Moderate Reporting & access Strong Operational safety Moderate ODD & traffic rules Moderate Cyber & change Limited Testing & oversight Moderate Caution: “USA” doesn’t use centralized rulebook—federal requirements and state programmes must be configured separately. What stands out Regulatory emphasis Evidence & data Reporting & access Operational safety ODD & traffic rules Cyber & change Testing & oversight • • • 130", "notes": "[Sources] - RoboTaxi.xlsx — comparison table (rows 3–52) - Key workbook references: [U1], [U4], [U6], [U12]", "s": 12, "hidden": false}, {"n": 131, "t": "Singapore", "x": "Singapore A centralize, monitoring-led regime built around LTA visibility What stands out • Always-on black-box recording and specified 2 Hz GPS/speed logging support traceability. • LTA AVMS and event evidence packages make regulator access operational, not theoretical. • TR 68 covers safety, fallback, traffic integration and cybersecurity in one coherent stack. Regulatory emphasis Evidence & data Strong Reporting & access Strong Operational safety Strong ODD & traffic rules Strong Cyber & change Strong Testing & oversight Strong Design implication: the monitoring platform must combine live supervision with preserved, unedited evidence. 131", "notes": "[Sources] - RoboTaxi.xlsx — comparison table (rows 3–52) - Key workbook references: TR 68; AMV Rules 2017; CETRAN; LTA AVMS", "s": 12, "hidden": false}, {"n": 132, "t": "China", "x": "China Real-time municipal oversight and rapid evidence submission are central What stands out • Vehicle data may be uploaded to a municipality’s real-time platform. • Shanghai requires substantial pre-incident video and rapid post-accident upload. • Operational controls are broad, but exact provisions differ by city or pilot zone. Regulatory emphasis Evidence & data Strong Reporting & access Strong Operational safety Strong ODD & traffic rules Strong Cyber & change Strong Testing & oversight Strong Caution: Shanghai, Beijing and Shenzhen references should be treated as local layers, not a single uniform national regime. 132", "notes": "[Sources] - RoboTaxi.xlsx — comparison table (rows 3–52) - Key workbook references: SH (Shanghai), BH/BHJAD (Beijing), SZ (Shenzhen)", "s": 12, "hidden": false}, {"n": 133, "t": "UNECE-adopting states", "x": "UNECE-adopting states The broadest lifecycle framework—from design assurance to in-service monitoring What stands out • Evidence requirements cover event-triggered windows, location precision and sensor fallback data. • Safety is assessed across design, manufacture, operation, reporting and corrective action. • Fallback, minimal-risk decisions, cybersecurity and authority access are explicitly connected. Regulatory emphasis Evidence & data Strong Reporting & access Strong Operational safety Strong ODD & traffic rules Strong Cyber & change Strong Testing & oversight Strong Design implication: retention and evidence windows must be policy-configurable across the vehicle lifecycle. 133", "notes": "[Sources] - RoboTaxi.xlsx — comparison table (rows 3–52) - Key workbook references: UN GTR 2026; UN GTR Brochure; Annex", "s": 12, "hidden": false}, {"n": 134, "t": "France", "x": "France Insight #1: Operational controls are visible Insight #2: evidence detail is limited What stands out • Fault reporting, remote termination, degraded operation and minimal-risk decisions are marked present. • Regulatory dashboard and short-term reporting are also indicated. • Retention, recorder, video, cybersecurity and testing details are mostly not mentioned. Regulatory emphasis Evidence & data Limited Reporting & access Moderate Operational safety Strong ODD & traffic rules Moderate Cyber & change Limited Testing & oversight Limited 134", "notes": "[Sources] - RoboTaxi.xlsx — comparison table (rows 3–52) - France column in RoboTaxi.xlsx; several cells are marked “Not mentioned” or blank", "s": 12, "hidden": false}, {"n": 135, "t": "What the differences mean", "x":
