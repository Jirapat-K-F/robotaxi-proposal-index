<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotaxi Proposal Index</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--mute:#5f6b7a;--line:#e2e6eb;--accent:#d0457a;--accent-ink:#fff;--chip:#fbe9f0;--hl:#ffe58a}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--panel:#1b1e23;--ink:#e8eaed;--mute:#9aa4b1;--line:#2c3138;--accent:#e9659a;--accent-ink:#111;--chip:#3a2230;--hl:#6b5a12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;white-space:nowrap}
#q{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{color:var(--mute);font-size:13px}
.hint kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace;background:var(--bg)}
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 58px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto;position:sticky;top:58px;height:calc(100vh - 58px)}
nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 6px 6px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--chip);color:var(--accent);font-weight:600}
nav button small{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
main{padding:16px;min-width:0}
#status{color:var(--mute);margin:0 0 12px;font-size:14px}
#status b{color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;left:8px;top:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:20px;padding:2px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.tag{position:absolute;right:8px;top:8px;background:#000a;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.meta{padding:8px 10px}
.meta .t{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .s{color:var(--mute);font-size:12px;margin-top:2px}
.meta .snip{font-size:12px;color:var(--mute);margin-top:4px}
mark{background:var(--hl);color:inherit;border-radius:2px}
#modal{position:fixed;inset:0;background:#000d;display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal img{max-width:100%;max-height:calc(100vh - 110px);border-radius:6px;background:#fff}
#modal .bar{color:#fff;display:flex;gap:14px;align-items:center;margin-top:10px;max-width:100%}
#modal .bar b{font-size:28px;color:var(--accent)}
#modal .bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal button{font:inherit;background:#fff2;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
#navtoggle{display:none}
@media (max-width:800px){
  .wrap{grid-template-columns:1fr}
  nav{position:static;height:auto;max-height:50vh;border-right:0;border-bottom:1px solid var(--line);display:none}
  nav.show{display:block}
  #navtoggle{display:inline-block;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .hint{display:none}
  #grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
</style>
</head>
<body>
<header>
  <h1>Robotaxi Proposal Index</h1>
  <button id="navtoggle">Topics</button>
  <input id="q" type="search" placeholder="Search all slide text… (TTC, PDPA, nuScenes, ค่าใช้จ่าย)" autocomplete="off">
  <span class="hint">Slideshow: type the number, then <kbd>Enter</kbd> · <kbd>/</kbd> search</span>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <p id="status"></p>
    <div id="grid"></div>
  </main>
</div>
<div id="modal"><img alt=""><div class="bar"><button data-d="-1">←</button><b></b><span></span><button data-d="1">→</button><button data-d="0">✕</button></div></div>
<script>
const D = /*DATA*/null;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bySlide = Object.fromEntries(D.slides.map(s => [s.n, s]));
let filter = null;   // {label, slides:[n...]}
let shown = [];      // slide numbers currently in the grid

// sidebar
const nav = $("#nav");
const btn = (label, right, f) => {
  const b = document.createElement("button");
  b.innerHTML = `<span>${esc(label)}</span><small>${right}</small>`;
  b.onclick = () => { filter = f; $("#q").value = ""; render(); nav.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); nav.classList.remove("show"); scrollTo(0, 0); };
  return b;
};
const h = t => { const e = document.createElement("h2"); e.textContent = t; nav.append(e); };
const all = btn("All slides", D.slides.length, null); all.classList.add("on"); nav.append(all);
h("Likely questions");
D.questions.forEach(q => nav.append(btn(q.q, q.slides.length, {label: q.q, slides: q.slides})));
h("Main deck");
D.sections.filter(s => !s.app).forEach(s => nav.append(btn(s.name, `${s.from}–${s.to}`, sec(s))));
h("Appendix");
D.sections.filter(s => s.app).forEach(s => nav.append(btn(s.name, `${s.from}–${s.to}`, sec(s))));
function sec(s){ const a = []; for (let i = s.from; i <= s.to; i++) a.push(i); return {label: s.name, slides: a}; }

function snippet(s, terms){
  const src = s.x + " " + s.notes, low = src.toLowerCase();
  const i = Math.max(0, low.indexOf(terms[0]));
  let out = esc(src.slice(Math.max(0, i - 50), i + 110));
  terms.forEach(t => { out = out.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`); });
  return (i > 50 ? "…" : "") + out + "…";
}

function render(){
  const terms = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  let list = filter ? filter.slides.map(n => bySlide[n]).filter(Boolean) : D.slides;
  if (terms.length) {
    list = D.slides.filter(s => { const hay = (s.t + " " + s.x + " " + s.notes + " " + D.sections[s.s].name).toLowerCase(); return terms.every(t => hay.includes(t)); });
  }
  shown = list.map(s => s.n);
  const what = terms.length ? `matching “${esc(terms.join(" "))}”` : filter ? `for <b>${esc(filter.label)}</b>` : "";
  $("#status").innerHTML = `${list.length} slide${list.length === 1 ? "" : "s"} ${what}` + (list.length ? ` — numbers: <b>${compact(shown)}</b>` : "");
  $("#grid").innerHTML = list.map(s => `
    <div class="card" data-n="${s.n}">
      <div class="thumb"><img loading="lazy" src="thumbs/${s.n}.jpg" alt=""><span class="num">${s.n}</span>${s.hidden ? '<span class="tag">hidden</span>' : ""}</div>
      <div class="meta"><div class="t">${esc(s.t)}</div><div class="s">${esc(D.sections[s.s].name)}</div>${terms.length ? `<div class="snip">${snippet(s, terms)}</div>` : ""}</div>
    </div>`).join("");
}
function compact(ns){ // 5,6,7,9 -> 5–7, 9
  const out = []; let a = ns[0], b = ns[0];
  for (const n of ns.slice(1).concat(null)) { if (n === b + 1) { b = n; continue; } out.push(a === b ? a : `${a}–${b}`); a = b = n; }
  return out.join(", ");
}

// modal
let cur = null;
function open(n){ cur = n; const s = bySlide[n]; $("#modal img").src = `thumbs/${n}.jpg`; $("#modal b").textContent = n; $("#modal span").textContent = s.t; $("#modal").classList.add("open"); }
function step(d){ const i = shown.indexOf(cur) + d; if (i >= 0 && i < shown.length) open(shown[i]); }
$("#grid").onclick = e => { const c = e.target.closest(".card"); if (c) open(+c.dataset.n); };
$("#modal").onclick = e => { const d = e.target.dataset.d; if (d === "0" || e.target.id === "modal") $("#modal").classList.remove("open"); else if (d) step(+d); };
document.addEventListener("keydown", e => {
  if ($("#modal").classList.contains("open")) {
    if (e.key === "Escape") $("#modal").classList.remove("open");
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  } else if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
$("#q").oninput = render;
$("#navtoggle").onclick = () => nav.classList.toggle("show");
render();
</script>
</body>
</html>
